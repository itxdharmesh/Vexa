<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VEXA - Home</title>
    <link rel="stylesheet" href="css/global.css">
</head>
<body>
    <div class="app-header">
        <a href="home.html" class="app-logo">VEXA</a>
        <a href="notifications.html" style="text-decoration:none;font-size:22px;">🔔</a>
    </div>

    <div class="container">
        <div class="card" style="padding:16px;">
            <h2 id="welcome-text" style="font-size:20px;margin-bottom:4px;">Welcome back!</h2>
            <p id="user-email" style="color:var(--text-muted);font-size:13px;">Loading...</p>
        </div>

        <div class="stats-grid" id="stats-grid">
            <div class="stat-card">
                <div class="stat-value" id="home-coins">0</div>
                <div class="stat-label">🪙 Coins</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="home-xp">0</div>
                <div class="stat-label">⭐ XP</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="home-level">1</div>
                <div class="stat-label">🏆 Level</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="home-streak">0</div>
                <div class="stat-label">🔥 Streak</div>
            </div>
        </div>

        <!-- Daily Reward -->
        <div class="card" id="daily-reward-card">
            <h3 style="font-size:16px;margin-bottom:12px;">🎁 Daily Reward</h3>
            <div id="daily-reward-content">
                <p style="font-size:14px;color:var(--text-secondary);">Loading...</p>
            </div>
        </div>

        <!-- Play Now -->
        <div class="card">
            <h3 style="font-size:16px;margin-bottom:12px;">🎮 Play Now</h3>
            <div id="featured-games" style="display:grid;grid-template-columns:repeat(2,1fr);gap:10px;"></div>
        </div>

        <!-- Friends Activity -->
        <div class="card">
            <h3 style="font-size:16px;margin-bottom:12px;">👥 Friends Activity</h3>
            <div id="friends-activity">
                <div class="empty-state">
                    <div class="empty-state-icon">👥</div>
                    <div class="empty-state-title">No activity yet</div>
                    <div class="empty-state-text">Add friends and start playing!</div>
                    <a href="friends.html" class="btn btn-primary btn-small">FIND FRIENDS</a>
                </div>
            </div>
        </div>
    </div>

    <nav class="bottom-nav">
        <a href="home.html" class="nav-item active"><span class="nav-icon">🏠</span><span>Home</span></a>
        <a href="games.html" class="nav-item"><span class="nav-icon">🎮</span><span>Games</span></a>
        <a href="search.html" class="nav-item"><span class="nav-icon">🔍</span><span>Search</span></a>
        <a href="chat.html" class="nav-item"><span class="nav-icon">💬</span><span>Chat</span></a>
        <a href="account.html" class="nav-item"><span class="nav-icon">👤</span><span>Account</span></a>
    </nav>

    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-storage-compat.js"></script>
    <script src="js/firebase-config.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/home.js"></script>
</body>
</html>
