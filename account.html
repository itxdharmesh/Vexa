<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VEXA - Account</title>
    <link rel="stylesheet" href="css/global.css">
</head>
<body>
    <div class="app-header">
        <a href="home.html" class="app-logo">VEXA</a>
        <span style="font-size:20px;">👤</span>
    </div>

    <div class="container">
        <!-- User Summary -->
        <div class="card" style="display:flex;align-items:center;gap:16px;padding:20px;">
            <div class="avatar avatar-large" id="account-avatar">?</div>
            <div style="flex:1;">
                <div style="font-size:18px;font-weight:700;" id="account-name">Loading...</div>
                <div style="font-size:13px;color:var(--text-muted);" id="account-username">@username</div>
                <div style="font-size:12px;color:var(--text-muted);margin-top:4px;" id="account-email">email@example.com</div>
            </div>
            <a href="edit-profile.html" class="btn btn-secondary btn-small">EDIT</a>
        </div>

        <!-- Stats -->
        <div class="stats-grid" style="grid-template-columns:repeat(3,1fr);">
            <div class="stat-card">
                <div class="stat-value" id="account-coins">0</div>
                <div class="stat-label">🪙 Coins</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="account-xp">0</div>
                <div class="stat-label">⭐ XP</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="account-streak">0</div>
                <div class="stat-label">🔥 Streak</div>
            </div>
        </div>

        <!-- Menu Items -->
        <div class="card" style="padding:0;overflow:hidden;">
            <a href="profile.html" class="menu-item">
                <span>👤</span> My Profile <span style="margin-left:auto;">›</span>
            </a>
            <a href="friends.html" class="menu-item">
                <span>👥</span> Friends <span style="margin-left:auto;">›</span>
            </a>
            <a href="settings.html" class="menu-item">
                <span>⚙️</span> Settings <span style="margin-left:auto;">›</span>
            </a>
            <a href="achievements.html" class="menu-item">
                <span>🏆</span> Achievements <span style="margin-left:auto;">›</span>
            </a>
            <a href="leaderboard.html" class="menu-item">
                <span>🥇</span> Leaderboard <span style="margin-left:auto;">›</span>
            </a>
            <a href="notifications.html" class="menu-item">
                <span>🔔</span> Notifications <span style="margin-left:auto;">›</span>
            </a>
        </div>

        <!-- Logout -->
        <button class="btn btn-danger" style="width:100%;" onclick="logout()">🚪 LOGOUT</button>
    </div>

    <style>
        .menu-item {
            display:flex;
            align-items:center;
            gap:12px;
            padding:16px 20px;
            color:var(--text-primary);
            text-decoration:none;
            font-size:14px;
            font-weight:500;
            border-bottom:1px solid var(--border);
            transition:background 0.2s;
        }
        .menu-item:hover {
            background:var(--bg-card-hover);
        }
        .menu-item:last-child {
            border-bottom:none;
        }
    </style>

    <nav class="bottom-nav">
        <a href="home.html" class="nav-item"><span class="nav-icon">🏠</span><span>Home</span></a>
        <a href="games.html" class="nav-item"><span class="nav-icon">🎮</span><span>Games</span></a>
        <a href="search.html" class="nav-item"><span class="nav-icon">🔍</span><span>Search</span></a>
        <a href="chat.html" class="nav-item"><span class="nav-icon">💬</span><span>Chat</span></a>
        <a href="account.html" class="nav-item active"><span class="nav-icon">👤</span><span>Account</span></a>
    </nav>

    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-storage-compat.js"></script>
    <script src="js/firebase-config.js"></script>
    <script src="js/utils.js"></script>
    <script>
        auth.onAuthStateChanged(async function(user) {
            if (!user) {
                window.location.replace('login.html');
                return;
            }
            
            try {
                var userSnapshot = await database.ref('users/' + user.uid).once('value');
                var userData = userSnapshot.val() || {};
                
                var progressSnapshot = await database.ref('progress/' + user.uid).once('value');
                var progressData = progressSnapshot.val() || { coins: 0, xp: 0 };
                
                var streakSnapshot = await database.ref('streaks/' + user.uid).once('value');
                var streakData = streakSnapshot.val() || { currentStreak: 0 };
                
                var avatarText = (userData.displayName || '?').charAt(0).toUpperCase();
                var avatarHTML = userData.avatarURL ? 
                    '<img src="' + userData.avatarURL + '" style="width:100%;height:100%;object-fit:cover;">' : 
                    avatarText;
                
                document.getElementById('account-avatar').innerHTML = avatarHTML;
                document.getElementById('account-name').textContent = userData.displayName || 'User';
                document.getElementById('account-username').textContent = '@' + (userData.username || 'user');
                document.getElementById('account-email').textContent = userData.email || user.email;
                document.getElementById('account-coins').textContent = Utils.formatNumber(progressData.coins);
                document.getElementById('account-xp').textContent = Utils.formatNumber(progressData.xp);
                document.getElementById('account-streak').textContent = streakData.currentStreak;
                
            } catch (error) {
                console.error('Error loading account:', error);
            }
        });
        
        function logout() {
            if (confirm('Are you sure you want to logout?')) {
                auth.signOut().then(function() {
                    window.location.replace('login.html');
                });
            }
        }
    </script>
</body>
</html>
