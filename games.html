<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VEXA - Games</title>
    <link rel="stylesheet" href="css/global.css">
</head>
<body>
    <div class="container" style="padding:20px 16px;">
        <div style="text-align:center;margin-bottom:16px;">
            <a href="home.html" style="text-decoration:none;color:var(--accent-blue);font-size:32px;font-weight:900;letter-spacing:3px;">VEXA</a>
            <p style="color:var(--text-muted);font-size:11px;letter-spacing:2px;margin-top:4px;">GAME HUB</p>
        </div>

        <h2 style="font-size:18px;font-weight:700;margin-bottom:12px;">🔥 POPULAR GAMES</h2>
        <div id="popular-games" style="display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:24px;">
            <p style="color:var(--text-muted);">Loading...</p>
        </div>

        <h2 style="font-size:18px;font-weight:700;margin-bottom:12px;">📂 GAME CATEGORIES</h2>
        <div id="categories-list"></div>

        <div class="card" style="margin-top:24px;text-align:center;padding:20px;">
            <div style="font-size:32px;">👥</div>
            <h3 style="font-size:16px;font-weight:700;">MULTIPLAYER</h3>
            <p style="color:var(--text-muted);font-size:13px;margin-top:4px;">Coming Soon 🚧</p>
        </div>
    </div>

    <nav class="bottom-nav">
        <a href="home.html" class="nav-item"><span class="nav-icon">🏠</span><span>Home</span></a>
        <a href="games.html" class="nav-item active"><span class="nav-icon">🎮</span><span>Games</span></a>
        <a href="search.html" class="nav-item"><span class="nav-icon">🔍</span><span>Search</span></a>
        <a href="chat.html" class="nav-item"><span class="nav-icon">💬</span><span>Chat</span></a>
        <a href="account.html" class="nav-item"><span class="nav-icon">👤</span><span>Account</span></a>
    </nav>

    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-database-compat.js"></script>
    <script src="js/firebase-config.js"></script>
    <script src="js/utils.js"></script>
    <script>
        auth.onAuthStateChanged(function(user) {
            if (!user) { window.location.replace('login.html'); return; }
            loadGames();
        });
        
        async function loadGames() {
            try {
                var response = await fetch('data/games.json');
                var games = await response.json();
                
                var popularContainer = document.getElementById('popular-games');
                
                popularContainer.innerHTML = games.slice(0, 4).map(function(game) {
                    var btnText = game.type === 'luck' ? 'PLAY (' + game.entryCost + ' 🪙)' : 'PLAY FREE';
                    return `
                        <a href="games/${game.id}.html" style="text-decoration:none;color:inherit;">
                            <div class="stat-card" style="text-align:center;padding:16px;cursor:pointer;">
                                <div style="font-size:36px;">${game.icon}</div>
                                <div style="font-weight:600;font-size:14px;margin-top:8px;">${game.name}</div>
                                <div style="font-size:11px;color:var(--text-muted);margin:4px 0;">${game.category}</div>
                                <button class="btn btn-primary btn-small" style="width:100%;margin-top:8px;">${btnText}</button>
                            </div>
                        </a>
                    `;
                }).join('');
                
                var categories = {};
                games.forEach(function(game) {
                    if (!categories[game.category]) categories[game.category] = [];
                    categories[game.category].push(game);
                });
                
                var categoriesContainer = document.getElementById('categories-list');
                
                categoriesContainer.innerHTML = Object.entries(categories).map(function([category, categoryGames]) {
                    return `
                        <div style="margin-bottom:20px;">
                            <h3 style="font-size:14px;font-weight:700;color:var(--accent-blue);margin-bottom:8px;">${category.toUpperCase()}</h3>
                            <div style="display:grid;grid-template-columns:repeat(2,1fr);gap:10px;">
                                ${categoryGames.map(function(game) {
                                    var btnText = game.type === 'luck' ? 'PLAY (' + game.entryCost + ' 🪙)' : 'PLAY FREE';
                                    return `
                                        <a href="games/${game.id}.html" style="text-decoration:none;color:inherit;">
                                            <div class="stat-card" style="text-align:center;padding:12px;cursor:pointer;">
                                                <div style="font-size:28px;">${game.icon}</div>
                                                <div style="font-weight:600;font-size:13px;margin-top:4px;">${game.name}</div>
                                                <button class="btn btn-primary btn-small" style="width:100%;margin-top:6px;font-size:10px;">${btnText}</button>
                                            </div>
                                        </a>
                                    `;
                                }).join('')}
                            </div>
                        </div>
                    `;
                }).join('');
                
            } catch (error) {
                console.error('Error:', error);
                document.getElementById('popular-games').innerHTML = '<p style="color:var(--danger);">Failed to load games</p>';
            }
        }
    </script>
</body>
</html>
