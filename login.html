<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VEXA - Login</title>
    <link rel="stylesheet" href="css/global.css">
</head>
<body>
    <div style="display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px;">
        <div class="card" style="width:100%;max-width:380px;padding:32px;">
            <h1 style="text-align:center;color:var(--accent-blue);font-size:28px;margin-bottom:4px;">VEXA</h1>
            <p style="text-align:center;color:var(--text-muted);margin-bottom:24px;font-size:14px;">Welcome back, gamer</p>
            
            <div id="error-box" style="display:none;background:rgba(239,68,68,0.1);border:1px solid #EF4444;color:#EF4444;padding:10px;border-radius:8px;margin-bottom:12px;font-size:13px;"></div>
            
            <form id="login-form">
                <div style="margin-bottom:14px;">
                    <label style="display:block;margin-bottom:6px;color:var(--text-secondary);font-size:13px;">Email</label>
                    <input type="email" id="email" class="input-field" placeholder="Enter your email" required>
                </div>
                <div style="margin-bottom:20px;">
                    <label style="display:block;margin-bottom:6px;color:var(--text-secondary);font-size:13px;">Password</label>
                    <input type="password" id="password" class="input-field" placeholder="Enter your password" required>
                </div>
                <button type="submit" class="btn btn-primary" style="width:100%;">LOGIN</button>
            </form>
            
            <p style="text-align:center;margin-top:16px;color:var(--text-muted);font-size:13px;">
                Don't have an account? <a href="signup.html" style="color:var(--accent-blue);text-decoration:none;font-weight:600;">Sign up</a>
            </p>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-storage-compat.js"></script>
    <script src="js/firebase-config.js"></script>
    <script src="js/utils.js"></script>
    <script>
        auth.onAuthStateChanged(function(user) {
            if (user) {
                window.location.replace('home.html');
            }
        });

        document.getElementById('login-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            var email = document.getElementById('email').value;
            var password = document.getElementById('password').value;
            var errorBox = document.getElementById('error-box');
            errorBox.style.display = 'none';
            
            try {
                await auth.signInWithEmailAndPassword(email, password);
                window.location.replace('home.html');
            } catch (error) {
                var messages = {
                    'auth/invalid-email': 'Invalid email address',
                    'auth/user-not-found': 'No account found with this email',
                    'auth/wrong-password': 'Incorrect password',
                    'auth/network-request-failed': 'Network error. Check connection',
                    'auth/invalid-credential': 'Invalid email or password'
                };
                errorBox.textContent = messages[error.code] || error.message;
                errorBox.style.display = 'block';
            }
        });
    </script>
</body>
</html>
