<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VEXA - Login</title>
    <link rel="icon" type="image/svg+xml" href="assets/logo/vexa-icon.svg">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Rajdhani:wght@300;400;500;600;700&family=Exo+2:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="css/vexa-brand.css">
    <link rel="stylesheet" href="css/global.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Exo 2', sans-serif;
            background: #0A0A0F;
            color: white;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .auth-box {
            width: 100%;
            max-width: 400px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 40px;
        }
        
        .auth-logo {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .auth-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 32px;
            font-weight: 900;
            background: linear-gradient(135deg, #FFFFFF, #00D4FF);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
        }
        
        .auth-subtitle {
            color: #a0a0b8;
            font-family: 'Rajdhani', sans-serif;
            font-size: 16px;
        }
        
        .input-group {
            margin-bottom: 16px;
        }
        
        .input-label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            color: #a0a0b8;
            font-family: 'Rajdhani', sans-serif;
            font-weight: 600;
        }
        
        .input-field {
            width: 100%;
            padding: 12px 16px;
            background: #12121a;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            color: white;
            font-size: 14px;
            font-family: 'Exo 2', sans-serif;
        }
        
        .input-field:focus {
            outline: none;
            border-color: #6C3CE1;
            box-shadow: 0 0 0 3px rgba(108, 60, 225, 0.4);
        }
        
        .btn-primary {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #6C3CE1, #00D4FF);
            border: none;
            border-radius: 12px;
            color: white;
            font-family: 'Rajdhani', sans-serif;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            letter-spacing: 1px;
            transition: all 0.3s ease;
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(108, 60, 225, 0.5);
        }
        
        .auth-footer {
            text-align: center;
            margin-top: 24px;
            color: #a0a0b8;
            font-size: 14px;
        }
        
        .auth-footer a {
            color: #00D4FF;
            text-decoration: none;
            font-weight: 600;
        }
        
        .error-message {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid #ef4444;
            color: #ef4444;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 16px;
            display: none;
            font-size: 14px;
        }
        
        .success-message {
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid #10b981;
            color: #10b981;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 16px;
            display: none;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="auth-box">
        <div class="auth-logo">
            <h1 class="auth-title">VEXA</h1>
            <p class="auth-subtitle">Welcome back, gamer</p>
        </div>
        
        <div class="error-message" id="error-message"></div>
        <div class="success-message" id="success-message"></div>
        
        <form id="login-form">
            <div class="input-group">
                <label class="input-label">Email</label>
                <input type="email" class="input-field" id="email" placeholder="Enter your email" required>
            </div>
            
            <div class="input-group">
                <label class="input-label">Password</label>
                <input type="password" class="input-field" id="password" placeholder="Enter your password" required>
            </div>
            
            <button type="submit" class="btn-primary">LOGIN</button>
        </form>
        
        <div class="auth-footer">
            Don't have an account? <a href="signup.html">Sign up</a>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-database-compat.js"></script>
    <script src="js/firebase-config.js"></script>
    <script>
        // Check if already logged in
        auth.onAuthStateChanged((user) => {
            if (user) {
                console.log('Already logged in, redirecting to home...');
                window.location.replace('home.html');
            }
        });
        
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errorMessage = document.getElementById('error-message');
            const successMessage = document.getElementById('success-message');
            
            // Hide messages
            errorMessage.style.display = 'none';
            successMessage.style.display = 'none';
            
            try {
                console.log('Attempting login...');
                
                const userCredential = await auth.signInWithEmailAndPassword(email, password);
                console.log('Login successful:', userCredential.user.uid);
                
                // Show success message
                successMessage.textContent = 'Login successful! Redirecting...';
                successMessage.style.display = 'block';
                
                // Redirect after short delay
                setTimeout(() => {
                    window.location.replace('home.html');
                }, 500);
                
            } catch (error) {
                console.error('Login error:', error);
                
                const errorMessages = {
                    'auth/invalid-email': 'Invalid email address',
                    'auth/user-disabled': 'This account has been disabled',
                    'auth/user-not-found': 'No account found with this email',
                    'auth/wrong-password': 'Incorrect password',
                    'auth/network-request-failed': 'Network error. Check your connection',
                    'auth/too-many-requests': 'Too many attempts. Try again later'
                };
                
                errorMessage.textContent = errorMessages[error.code] || error.message || 'Login failed';
                errorMessage.style.display = 'block';
            }
        });
    </script>
</body>
</html>
