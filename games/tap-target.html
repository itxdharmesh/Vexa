<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VEXA - Tap Target</title>
    <link rel="stylesheet" href="../css/global.css">
    <style>
        .game-area {
            width: 100%; max-width: 400px; height: 400px; margin: 16px auto;
            background: var(--bg-card); border: 2px solid var(--border);
            border-radius: 16px; position: relative; overflow: hidden;
        }
        .target {
            position: absolute; width: 50px; height: 50px; border-radius: 50%;
            background: linear-gradient(135deg, var(--accent-purple), var(--accent-blue));
            cursor: pointer; animation: pop 0.3s ease; display: flex;
            align-items: center; justify-content: center; font-size: 24px;
        }
        @keyframes pop { from { transform: scale(0); } to { transform: scale(1); } }
    </style>
</head>
<body>
    <div class="app-header">
        <a href="../games.html" style="text-decoration:none;color:var(--text-primary);font-size:20px;">←</a>
        <span style="font-weight:600;">🎯 Tap Target</span>
        <span></span>
    </div>

    <div style="max-width:400px;margin:0 auto;padding:16px;">
        <div class="stats-grid" style="grid-template-columns:repeat(3,1fr);">
            <div class="stat-card">
                <div class="stat-value" id="score">0</div>
                <div class="stat-label">Score</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="time">30s</div>
                <div class="stat-label">Time</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="best">0</div>
                <div class="stat-label">Best</div>
            </div>
        </div>

        <div class="game-area" id="game-area"></div>
        
        <button class="btn btn-primary" style="width:100%;" onclick="startGame()">START GAME</button>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-database-compat.js"></script>
    <script src="../js/firebase-config.js"></script>
    <script src="../js/utils.js"></script>
    <script>
        let currentUser = null;
        let score = 0, timeLeft = 30, bestScore = 0;
        let gameActive = false, timerInterval = null;
        
        auth.onAuthStateChanged(async function(user) {
            if (!user) { window.location.replace('../login.html'); return; }
            currentUser = user;
            var snapshot = await database.ref('gameStats/' + currentUser.uid + '/tap-target').once('value');
            var stats = snapshot.val();
            if (stats) {
                bestScore = stats.highScore || 0;
                document.getElementById('best').textContent = bestScore;
            }
        });
        
        function startGame() {
            score = 0; timeLeft = 30; gameActive = true;
            document.getElementById('score').textContent = score;
            document.getElementById('time').textContent = timeLeft + 's';
            
            clearInterval(timerInterval);
            timerInterval = setInterval(function() {
                timeLeft--;
                document.getElementById('time').textContent = timeLeft + 's';
                if (timeLeft <= 0) endGame();
            }, 1000);
            
            spawnTarget();
        }
        
        function spawnTarget() {
            if (!gameActive) return;
            var area = document.getElementById('game-area');
            area.innerHTML = '';
            
            var target = document.createElement('div');
            target.className = 'target';
            target.textContent = '🎯';
            
            var maxX = area.clientWidth - 50;
            var maxY = area.clientHeight - 50;
            var x = Math.random() * maxX;
            var y = Math.random() * maxY;
            
            target.style.left = x + 'px';
            target.style.top = y + 'px';
            target.onclick = function() {
                score++;
                document.getElementById('score').textContent = score;
                spawnTarget();
            };
            
            area.appendChild(target);
        }
        
        async function endGame() {
            gameActive = false;
            clearInterval(timerInterval);
            
            if (score > bestScore) {
                bestScore = score;
                document.getElementById('best').textContent = bestScore;
            }
            
            var gameRef = database.ref('gameStats/' + currentUser.uid + '/tap-target');
            var snapshot = await gameRef.once('value');
            var stats = snapshot.val() || { gamesPlayed: 0 };
            await gameRef.update({
                highScore: bestScore,
                gamesPlayed: stats.gamesPlayed + 1
            });
            
            var progressRef = database.ref('progress/' + currentUser.uid);
            var progressSnapshot = await progressRef.once('value');
            var progress = progressSnapshot.val() || { coins: 0, xp: 0 };
            await progressRef.update({ xp: progress.xp + score, coins: progress.coins + Math.floor(score / 2) });
            
            Utils.showToast('Score: ' + score + ' | +' + score + ' XP', 'success');
        }
    </script>
</body>
  </html>
