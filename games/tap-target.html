<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VEXA - Tap Target</title>
    <link rel="stylesheet" href="../css/global.css">
    <style>
        .game-wrap { max-width: 400px; margin: 0 auto; padding: 16px; }
        .game-area {
            width: 100%; height: 350px; margin: 16px 0; background: var(--bg-card);
            border: 2px solid var(--border); border-radius: 16px; position: relative; overflow: hidden;
        }
        .target {
            position: absolute; width: 50px; height: 50px; border-radius: 50%;
            background: linear-gradient(135deg, var(--accent-purple), var(--accent-blue));
            cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 24px;
            animation: pop 0.3s ease;
        }
        @keyframes pop { from { transform: scale(0); } to { transform: scale(1); } }
    </style>
</head>
<body>
    <div class="app-header">
        <a href="../games.html" style="text-decoration:none;color:var(--text-primary);font-size:20px;">←</a>
        <span style="font-weight:600;">🎯 Tap Target</span>
        <span></span>
    </div>

    <div class="game-wrap">
        <div class="stats-grid" style="grid-template-columns:repeat(3,1fr);">
            <div class="stat-card"><div class="stat-value" id="score">0</div><div class="stat-label">Score</div></div>
            <div class="stat-card"><div class="stat-value" id="time">30s</div><div class="stat-label">Time</div></div>
            <div class="stat-card"><div class="stat-value" id="best">0</div><div class="stat-label">Best</div></div>
        </div>

        <div class="game-area" id="game-area"></div>
        
        <button class="btn btn-primary" style="width:100%;" onclick="startGame()">START GAME</button>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-database-compat.js"></script>
    <script src="../js/firebase-config.js"></script>
    <script src="../js/utils.js"></script>
    <script>
        let currentUser = null;
        let score = 0, timeLeft = 30, bestScore = 0;
        let gameActive = false, timerInterval = null;

        auth.onAuthStateChanged(async function(user) {
            if (!user) { window.location.replace('../login.html'); return; }
            currentUser = user;
            var snapshot = await database.ref('gameStats/' + user.uid + '/tap-target').once('value');
            var stats = snapshot.val();
            if (stats) { bestScore = stats.highScore || 0; document.getElementById('best').textContent = bestScore; }
        });

        function startGame() {
            score = 0; timeLeft = 30; gameActive = true;
            document.getElementById('score').textContent = score;
            document.getElementById('time').textContent = timeLeft + 's';
            clearInterval(timerInterval);
            timerInterval = setInterval(function() {
                timeLeft--;
                document.getElementById('time').textContent = timeLeft + 's';
                if (timeLeft <= 0) endGame();
            }, 1000);
            spawnTarget();
        }

        function spawnTarget() {
            if (!gameActive) return;
            var area = document.getElementById('game-area');
            area.innerHTML = '';
            var target = document.createElement('div');
            target.className = 'target';
            target.textContent = '🎯';
            var maxX = area.clientWidth - 50;
            var maxY = area.clientHeight - 50;
            target.style.left = Math.random() * maxX + 'px';
            target.style.top = Math.random() * maxY + 'px';
            target.onclick = function() { score++; document.getElementById('score').textContent = score; spawnTarget(); };
            area.appendChild(target);
        }

        function endGame() {
            gameActive = false;
            clearInterval(timerInterval);
            if (score > bestScore) { bestScore = score; document.getElementById('best').textContent = bestScore; }
            var xpEarned = score;
            var coinsEarned = Math.floor(score / 2);
            showGameEnd(score, xpEarned, coinsEarned);
        }

        function showGameEnd(score, xpEarned, coinsEarned) {
            var overlay = document.createElement('div');
            overlay.style.cssText = 'position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.9);z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px;';
            overlay.innerHTML = `
                <div style="background:var(--bg-card);border:2px solid var(--accent-purple);border-radius:20px;padding:30px;text-align:center;max-width:320px;width:100%;">
                    <div style="font-size:48px;margin-bottom:12px;">🎯</div>
                    <h2 style="font-size:22px;margin-bottom:4px;">Score: ${score}</h2>
                    <div style="display:flex;gap:10px;justify-content:center;margin:16px 0;">
                        <div style="background:var(--bg-primary);padding:12px;border-radius:10px;flex:1;">
                            <div style="font-size:20px;font-weight:700;color:var(--accent-blue);">+${xpEarned}</div>
                            <div style="font-size:11px;color:var(--text-muted);">⭐ XP</div>
                        </div>
                        <div style="background:var(--bg-primary);padding:12px;border-radius:10px;flex:1;">
                            <div style="font-size:20px;font-weight:700;color:#FFD700;">+${coinsEarned}</div>
                            <div style="font-size:11px;color:var(--text-muted);">🪙 Coins</div>
                        </div>
                    </div>
                    <button class="btn btn-primary" style="width:100%;margin-bottom:8px;" onclick="claimReward(${xpEarned},${coinsEarned},${score})">CLAIM REWARD</button>
                    <button class="btn btn-secondary" style="width:100%;" onclick="window.location.replace('../games.html')">GO TO GAMES HUB</button>
                </div>
            `;
            document.body.appendChild(overlay);
        }

        async function claimReward(xpEarned, coinsEarned, score) {
            try {
                var progressRef = database.ref('progress/' + currentUser.uid);
                var snapshot = await progressRef.once('value');
                var progress = snapshot.val() || { coins: 0, xp: 0 };
                await progressRef.update({ xp: progress.xp + xpEarned, coins: progress.coins + coinsEarned });
                
                var gameRef = database.ref('gameStats/' + currentUser.uid + '/tap-target');
                await gameRef.update({ gamesPlayed: firebase.database.ServerValue.increment(1), highScore: bestScore });
                
                Utils.showToast('Reward claimed!', 'success');
                setTimeout(function() { window.location.replace('../games.html'); }, 1000);
            } catch (error) { console.error('Claim error:', error); }
        }
    </script>
</body>
</html>w
