<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VEXA - Football Challenge</title>
    <link rel="icon" type="image/svg+xml" href="../assets/logo/vexa-icon.svg">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Rajdhani:wght@300;400;500;600;700&family=Exo+2:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="../css/vexa-brand.css">
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/animations.css">
    <style>
        .game-container {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
        }
        
        .game-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            max-width: 400px;
            margin-bottom: 20px;
        }
        
        .back-btn {
            background: var(--vexa-glass);
            border: 1px solid var(--vexa-glass-border);
            color: var(--text-primary);
            padding: 8px 16px;
            border-radius: var(--vexa-radius-md);
            cursor: pointer;
            text-decoration: none;
            font-family: var(--vexa-font-secondary);
            font-weight: 600;
            font-size: 14px;
        }
        
        .football-field {
            width: 100%;
            max-width: 400px;
            height: 400px;
            background: linear-gradient(180deg, #1a5c1a, #0d3d0d);
            border: 2px solid #2d8a2d;
            border-radius: var(--vexa-radius-lg);
            position: relative;
            margin: 20px 0;
            overflow: hidden;
            cursor: crosshair;
        }
        
        .goal {
            position: absolute;
            width: 120px;
            height: 80px;
            border: 4px solid white;
            background: rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
        }
        
        .goal-left {
            left: 0;
            top: 50%;
            transform: translateY(-50%);
            border-left: none;
        }
        
        .goal-right {
            right: 0;
            top: 50%;
            transform: translateY(-50%);
            border-right: none;
        }
        
        .ball {
            width: 30px;
            height: 30px;
            background: white;
            border-radius: 50%;
            position: absolute;
            cursor: pointer;
            transition: all 0.1s ease;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }
        
        .goalkeeper {
            width: 40px;
            height: 60px;
            background: #FFD700;
            border-radius: 10px;
            position: absolute;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
        }
        
        .game-stats {
            display: flex;
            gap: 16px;
            justify-content: center;
            margin: 20px 0;
            width: 100%;
            max-width: 400px;
        }
        
        .stat-box {
            background: var(--vexa-glass);
            border: 1px solid var(--vexa-glass-border);
            border-radius: var(--vexa-radius-md);
            padding: 12px;
            flex: 1;
            text-align: center;
        }
        
        .stat-label {
            font-size: 11px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            font-family: var(--vexa-font-secondary);
            font-weight: 600;
        }
        
        .stat-value {
            font-size: 20px;
            font-weight: 700;
            color: var(--vexa-secondary);
            font-family: var(--vexa-font-primary);
        }
        
        .result-text {
            font-size: 20px;
            font-weight: bold;
            margin: 16px 0;
            min-height: 30px;
        }
        
        .shoot-btn {
            padding: 16px 32px;
            background: linear-gradient(135deg, #10b981, #00D4FF);
            border: none;
            border-radius: var(--vexa-radius-md);
            color: white;
            font-family: var(--vexa-font-secondary);
            font-weight: 700;
            font-size: 18px;
            cursor: pointer;
            letter-spacing: 2px;
            transition: all 0.3s ease;
        }
        
        .shoot-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(16, 185, 129, 0.5);
        }
    </style>
</head>
<body>
    <div class="vexa-bg-pattern"></div>
    
    <div class="game-container">
        <div class="game-header">
            <a href="../games.html" class="back-btn">← Back</a>
            <h1 class="vexa-title" style="font-size: 24px;">⚽ Football Challenge</h1>
        </div>
        
        <div class="game-stats">
            <div class="stat-box">
                <div class="stat-label">Goals</div>
                <div class="stat-value" id="goals">0</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">Attempts</div>
                <div class="stat-value" id="attempts">0</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">Time</div>
                <div class="stat-value" id="time">30s</div>
            </div>
        </div>
        
        <div class="football-field" id="field">
            <div class="goal goal-left">🥅</div>
            <div class="goal goal-right">🥅</div>
            <div class="goalkeeper" id="goalkeeper">🧤</div>
            <div class="ball" id="ball">⚽</div>
        </div>
        
        <div class="result-text" id="result"></div>
        
        <button class="shoot-btn" onclick="startGame()">START GAME</button>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-database-compat.js"></script>
    <script src="../js/firebase-config.js"></script>
    <script src="../js/utils.js"></script>
    <script>
        let currentUser = null;
        let goals = 0;
        let attempts = 0;
        let timeLeft = 30;
        let gameActive = false;
        let timer = null;
        
        auth.onAuthStateChanged(async (user) => {
            if (!user) {
                window.location.href = '../login.html';
                return;
            }
            currentUser = user;
        });
        
        function startGame() {
            gameActive = true;
            goals = 0;
            attempts = 0;
            timeLeft = 30;
            
            document.getElementById('goals').textContent = goals;
            document.getElementById('attempts').textContent = attempts;
            document.getElementById('result').textContent = '';
            
            startTimer();
            moveGoalkeeper();
            resetBall();
        }
        
        function startTimer() {
            clearInterval(timer);
            timer = setInterval(() => {
                timeLeft--;
                document.getElementById('time').textContent = `${timeLeft}s`;
                
                if (timeLeft <= 0) {
                    endGame();
                }
            }, 1000);
        }
        
        function moveGoalkeeper() {
            if (!gameActive) return;
            
            const keeper = document.getElementById('goalkeeper');
            const field = document.getElementById('field');
            const fieldRect = field.getBoundingClientRect();
            
            const randomY = Math.random() * (fieldRect.height - 60);
            keeper.style.left = '50%';
            keeper.style.top = `${randomY}px`;
            
            setTimeout(moveGoalkeeper, Math.random() * 2000 + 1000);
        }
        
        function resetBall() {
            if (!gameActive) return;
            
            const ball = document.getElementById('ball');
            const field = document.getElementById('field');
            const fieldRect = field.getBoundingClientRect();
            
            const randomX = Math.random() * (fieldRect.width - 30);
            const randomY = Math.random() * (fieldRect.height - 30);
            
            ball.style.left = `${randomX}px`;
            ball.style.top = `${randomY}px`;
        }
        
        function shootBall() {
            if (!gameActive) return;
            
            attempts++;
            document.getElementById('attempts').textContent = attempts;
            
            const ball = document.getElementById('ball');
            const ballRect = ball.getBoundingClientRect();
            const keeper = document.getElementById('goalkeeper');
            const keeperRect = keeper.getBoundingClientRect();
            
            // Check if ball overlaps with goalkeeper
            const overlap = !(ballRect.right < keeperRect.left || 
                             ballRect.left > keeperRect.right || 
                             ballRect.bottom < keeperRect.top || 
                             ballRect.top > keeperRect.bottom);
            
            if (!overlap) {
                goals++;
                document.getElementById('goals').textContent = goals;
                document.getElementById('result').textContent = '⚽ GOAL!';
                document.getElementById('result').style.color = '#10b981';
            } else {
                document.getElementById('result').textContent = '🧤 Saved by goalkeeper!';
                document.getElementById('result').style.color = '#ef4444';
            }
            
            setTimeout(resetBall, 500);
        }
        
        async function endGame() {
            gameActive = false;
            clearInterval(timer);
            
            const earnedCoins = goals * 10;
            
            const progressRef = database.ref(`usersProgress/${currentUser.uid}`);
            const progressSnapshot = await progressRef.once('value');
            const progressData = progressSnapshot.val();
            
            await progressRef.update({
                coins: progressData.coins + earnedCoins
            });
            
            const statsRef = database.ref(`gameStats/${currentUser.uid}/football_challenge`);
            await statsRef.update({
                gamesPlayed: firebase.database.ServerValue.increment(1),
                highScore: goals
            });
            
            if (goals > 0) {
                await awardXP(goals * 5);
            }
            
            document.getElementById('result').textContent = `Game Over! ${goals} goals! Earned ${earnedCoins} coins!`;
            document.getElementById('result').style.color = '#00D4FF';
        }
        
        async function awardXP(xpAmount) {
            const progressRef = database.ref(`usersProgress/${currentUser.uid}`);
            const snapshot = await progressRef.once('value');
            const data = snapshot.val();
            await progressRef.update({
                totalXP: data.totalXP + xpAmount
            });
        }
        
        // Ball click handler
        document.getElementById('ball').addEventListener('click', shootBall);
        document.getElementById('field').addEventListener('click', shootBall);
    </script>
</body>
</html>
