<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VEXA - Memory Match</title>
    <link rel="stylesheet" href="../css/global.css">
    <style>
        .game-wrap { max-width: 400px; margin: 0 auto; padding: 16px; }
        .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 16px 0; }
        .card {
            aspect-ratio: 1; background: var(--bg-card); border: 2px solid var(--border);
            border-radius: 8px; display: flex; align-items: center; justify-content: center;
            font-size: 28px; cursor: pointer; transition: all 0.3s;
        }
        .card.flipped { background: var(--bg-card-hover); border-color: var(--accent-purple); }
        .card.matched { background: rgba(16,185,129,0.2); border-color: var(--success); pointer-events: none; }
    </style>
</head>
<body>
    <div class="app-header">
        <a href="../games.html" style="text-decoration:none;color:var(--text-primary);font-size:20px;">←</a>
        <span style="font-weight:600;">🧠 Memory Match</span>
        <span></span>
    </div>

    <div class="game-wrap">
        <div class="stats-grid" style="grid-template-columns:repeat(3,1fr);">
            <div class="stat-card"><div class="stat-value" id="moves">0</div><div class="stat-label">Moves</div></div>
            <div class="stat-card"><div class="stat-value" id="matches">0</div><div class="stat-label">Matches</div></div>
            <div class="stat-card"><div class="stat-value" id="timer">0s</div><div class="stat-label">Time</div></div>
        </div>

        <div class="grid" id="grid"></div>
        
        <button class="btn btn-primary" style="width:100%;" onclick="startGame()">RESTART</button>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-database-compat.js"></script>
    <script src="../js/firebase-config.js"></script>
    <script src="../js/utils.js"></script>
    <script>
        let currentUser = null;
        let moves = 0, matches = 0, seconds = 0;
        let flippedCards = [], isLocked = false, timerInterval = null;
        const emojis = ['🎮','🚀','⭐','🎯','💎','🔥','🌟','🎨'];

        auth.onAuthStateChanged(function(user) {
            if (!user) { window.location.replace('../login.html'); return; }
            currentUser = user;
            startGame();
        });

        function startGame() {
            clearInterval(timerInterval);
            moves = 0; matches = 0; seconds = 0;
            flippedCards = []; isLocked = false;
            document.getElementById('moves').textContent = moves;
            document.getElementById('matches').textContent = matches;
            document.getElementById('timer').textContent = '0s';
            
            var cards = [...emojis, ...emojis];
            cards.sort(function() { return Math.random() - 0.5; });
            
            var grid = document.getElementById('grid');
            grid.innerHTML = '';
            
            cards.forEach(function(emoji) {
                var card = document.createElement('div');
                card.className = 'card';
                card.dataset.emoji = emoji;
                card.onclick = function() { flipCard(card); };
                grid.appendChild(card);
            });
            
            timerInterval = setInterval(function() {
                seconds++;
                document.getElementById('timer').textContent = seconds + 's';
            }, 1000);
        }

        function flipCard(card) {
            if (isLocked || card.classList.contains('flipped') || card.classList.contains('matched')) return;
            card.classList.add('flipped');
            card.textContent = card.dataset.emoji;
            flippedCards.push(card);
            
            if (flippedCards.length === 2) {
                moves++;
                document.getElementById('moves').textContent = moves;
                
                if (flippedCards[0].dataset.emoji === flippedCards[1].dataset.emoji) {
                    flippedCards[0].classList.add('matched');
                    flippedCards[1].classList.add('matched');
                    matches++;
                    document.getElementById('matches').textContent = matches;
                    flippedCards = [];
                    
                    if (matches === emojis.length) {
                        clearInterval(timerInterval);
                        var xpEarned = 15;
                        var coinsEarned = 10;
                        showGameEnd(moves, xpEarned, coinsEarned);
                    }
                } else {
                    isLocked = true;
                    setTimeout(function() {
                        flippedCards[0].classList.remove('flipped');
                        flippedCards[1].classList.remove('flipped');
                        flippedCards[0].textContent = '';
                        flippedCards[1].textContent = '';
                        flippedCards = [];
                        isLocked = false;
                    }, 800);
                }
            }
        }

        function showGameEnd(score, xpEarned, coinsEarned) {
            var overlay = document.createElement('div');
            overlay.style.cssText = 'position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.9);z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px;';
            overlay.innerHTML = `
                <div style="background:var(--bg-card);border:2px solid var(--accent-purple);border-radius:20px;padding:30px;text-align:center;max-width:320px;width:100%;">
                    <div style="font-size:48px;margin-bottom:12px;">🎉</div>
                    <h2 style="font-size:22px;margin-bottom:4px;">Game Over!</h2>
                    <p style="color:var(--text-muted);font-size:14px;margin-bottom:16px;">Moves: ${score}</p>
                    <div style="display:flex;gap:10px;justify-content:center;margin-bottom:20px;">
                        <div style="background:var(--bg-primary);padding:12px;border-radius:10px;flex:1;">
                            <div style="font-size:20px;font-weight:700;color:var(--accent-blue);">+${xpEarned}</div>
                            <div style="font-size:11px;color:var(--text-muted);">⭐ XP</div>
                        </div>
                        <div style="background:var(--bg-primary);padding:12px;border-radius:10px;flex:1;">
                            <div style="font-size:20px;font-weight:700;color:#FFD700;">+${coinsEarned}</div>
                            <div style="font-size:11px;color:var(--text-muted);">🪙 Coins</div>
                        </div>
                    </div>
                    <button class="btn btn-primary" style="width:100%;margin-bottom:8px;" onclick="claimReward(${xpEarned},${coinsEarned},${score})">CLAIM REWARD</button>
                    <button class="btn btn-secondary" style="width:100%;" onclick="window.location.replace('../games.html')">GO TO GAMES HUB</button>
                </div>
            `;
            document.body.appendChild(overlay);
        }

        async function claimReward(xpEarned, coinsEarned, score) {
            try {
                var progressRef = database.ref('progress/' + currentUser.uid);
                var snapshot = await progressRef.once('value');
                var progress = snapshot.val() || { coins: 0, xp: 0 };
                
                await progressRef.update({
                    xp: (progress.xp || 0) + xpEarned,
                    coins: (progress.coins || 0) + coinsEarned
                });
                
                var gameRef = database.ref('gameStats/' + currentUser.uid + '/memory-match');
                var gameSnapshot = await gameRef.once('value');
                var stats = gameSnapshot.val() || { gamesPlayed: 0, highScore: 999 };
                await gameRef.update({
                    gamesPlayed: (stats.gamesPlayed || 0) + 1,
                    highScore: Math.min(stats.highScore || 999, score)
                });
                
                Utils.showToast('Reward claimed!', 'success');
                setTimeout(function() { window.location.replace('../games.html'); }, 1000);
            } catch (error) {
                console.error('Claim error:', error);
            }
        }
    </script>
</body>
</html>
