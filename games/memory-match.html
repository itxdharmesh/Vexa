<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VEXA - Memory Match</title>
    <link rel="stylesheet" href="../css/global.css">
    <style>
        .game-container { max-width: 400px; margin: 0 auto; padding: 16px; }
        .memory-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 16px 0; }
        .memory-card {
            aspect-ratio: 1; background: var(--bg-card); border: 2px solid var(--border);
            border-radius: 8px; display: flex; align-items: center; justify-content: center;
            font-size: 28px; cursor: pointer; transition: all 0.3s;
        }
        .memory-card.flipped { background: var(--bg-card-hover); border-color: var(--accent-purple); }
        .memory-card.matched { background: rgba(16,185,129,0.2); border-color: var(--success); pointer-events: none; }
    </style>
</head>
<body>
    <div class="app-header">
        <a href="../games.html" style="text-decoration:none;color:var(--text-primary);font-size:20px;">←</a>
        <span style="font-weight:600;">🧠 Memory Match</span>
        <span></span>
    </div>

    <div class="game-container">
        <div class="stats-grid" style="grid-template-columns:repeat(3,1fr);">
            <div class="stat-card">
                <div class="stat-value" id="moves">0</div>
                <div class="stat-label">Moves</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="matches">0</div>
                <div class="stat-label">Matches</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="timer">0s</div>
                <div class="stat-label">Time</div>
            </div>
        </div>

        <div class="memory-grid" id="grid"></div>
        
        <div id="result" style="text-align:center;font-size:18px;font-weight:600;margin:12px 0;"></div>
        
        <button class="btn btn-primary" style="width:100%;" onclick="startGame()">RESTART</button>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-database-compat.js"></script>
    <script src="../js/firebase-config.js"></script>
    <script src="../js/utils.js"></script>
    <script>
        let currentUser = null;
        let moves = 0, matches = 0, seconds = 0;
        let flippedCards = [], isLocked = false, timerInterval = null;
        const emojis = ['🎮','🚀','⭐','🎯','💎','🔥','🌟','🎨'];
        
        auth.onAuthStateChanged(function(user) {
            if (!user) { window.location.replace('../login.html'); return; }
            currentUser = user;
            startGame();
        });
        
        function startGame() {
            clearInterval(timerInterval);
            moves = 0; matches = 0; seconds = 0;
            flippedCards = []; isLocked = false;
            
            document.getElementById('moves').textContent = moves;
            document.getElementById('matches').textContent = matches;
            document.getElementById('timer').textContent = '0s';
            document.getElementById('result').textContent = '';
            
            var cards = [...emojis, ...emojis];
            cards.sort(function() { return Math.random() - 0.5; });
            
            var grid = document.getElementById('grid');
            grid.innerHTML = '';
            
            cards.forEach(function(emoji, index) {
                var card = document.createElement('div');
                card.className = 'memory-card';
                card.dataset.emoji = emoji;
                card.dataset.index = index;
                card.onclick = function() { flipCard(card); };
                grid.appendChild(card);
            });
            
            timerInterval = setInterval(function() {
                seconds++;
                document.getElementById('timer').textContent = seconds + 's';
            }, 1000);
        }
        
        function flipCard(card) {
            if (isLocked || card.classList.contains('flipped') || card.classList.contains('matched')) return;
            
            card.classList.add('flipped');
            card.textContent = card.dataset.emoji;
            flippedCards.push(card);
            
            if (flippedCards.length === 2) {
                moves++;
                document.getElementById('moves').textContent = moves;
                
                if (flippedCards[0].dataset.emoji === flippedCards[1].dataset.emoji) {
                    flippedCards[0].classList.add('matched');
                    flippedCards[1].classList.add('matched');
                    matches++;
                    document.getElementById('matches').textContent = matches;
                    flippedCards = [];
                    
                    if (matches === emojis.length) {
                        clearInterval(timerInterval);
                        document.getElementById('result').textContent = '🎉 Completed in ' + moves + ' moves and ' + seconds + 's!';
                        document.getElementById('result').style.color = '#10B981';
                        saveScore();
                    }
                } else {
                    isLocked = true;
                    setTimeout(function() {
                        flippedCards[0].classList.remove('flipped');
                        flippedCards[1].classList.remove('flipped');
                        flippedCards[0].textContent = '';
                        flippedCards[1].textContent = '';
                        flippedCards = [];
                        isLocked = false;
                    }, 800);
                }
            }
        }
        
        async function saveScore() {
            var gameRef = database.ref('gameStats/' + currentUser.uid + '/memory-match');
            var snapshot = await gameRef.once('value');
            var stats = snapshot.val() || { highScore: 0, gamesPlayed: 0 };
            
            await gameRef.update({
                highScore: Math.max(stats.highScore, matches),
                gamesPlayed: stats.gamesPlayed + 1
            });
            
            // Award XP
            var progressRef = database.ref('progress/' + currentUser.uid);
            var progressSnapshot = await progressRef.once('value');
            var progress = progressSnapshot.val() || { coins: 0, xp: 0 };
            await progressRef.update({ xp: progress.xp + 15, coins: progress.coins + 10 });
            
            Utils.showToast('+15 XP, +10 Coins!', 'success');
        }
    </script>
</body>
</html>
