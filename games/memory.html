<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VEXA - Memory Match</title>
    <link rel="icon" type="image/svg+xml" href="../assets/logo/vexa-icon.svg">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Rajdhani:wght@300;400;500;600;700&family=Exo+2:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="../css/vexa-brand.css">
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/animations.css">
    <style>
        .game-container {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
        }
        
        .game-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            max-width: 400px;
            margin-bottom: 20px;
        }
        
        .back-btn {
            background: var(--vexa-glass);
            border: 1px solid var(--vexa-glass-border);
            color: var(--text-primary);
            padding: 8px 16px;
            border-radius: var(--vexa-radius-md);
            cursor: pointer;
            text-decoration: none;
            font-family: var(--vexa-font-secondary);
            font-weight: 600;
            font-size: 14px;
        }
        
        .memory-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            margin: 20px 0;
            width: 100%;
            max-width: 400px;
        }
        
        .memory-card {
            aspect-ratio: 1;
            background: var(--vexa-glass);
            border: 2px solid var(--vexa-primary);
            border-radius: var(--vexa-radius-md);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            cursor: pointer;
            transition: all 0.3s ease;
            transform-style: preserve-3d;
        }
        
        .memory-card.flipped {
            background: var(--vexa-card-hover);
            border-color: var(--vexa-secondary);
            transform: rotateY(180deg);
        }
        
        .memory-card.matched {
            background: rgba(16, 185, 129, 0.2);
            border-color: #10b981;
            pointer-events: none;
        }
        
        .game-stats {
            display: flex;
            gap: 16px;
            justify-content: center;
            margin: 24px 0;
            width: 100%;
            max-width: 400px;
        }
        
        .stat-box {
            background: var(--vexa-glass);
            border: 1px solid var(--vexa-glass-border);
            border-radius: var(--vexa-radius-md);
            padding: 12px;
            flex: 1;
            text-align: center;
        }
        
        .stat-label {
            font-size: 11px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .stat-value {
            font-size: 20px;
            font-weight: 700;
            color: var(--vexa-secondary);
        }
        
        .result-text {
            font-size: 24px;
            font-weight: bold;
            margin: 16px 0;
            min-height: 36px;
        }
    </style>
</head>
<body>
    <div class="vexa-bg-pattern"></div>
    
    <div class="game-container">
        <div class="game-header">
            <a href="../games.html" class="back-btn">← Back</a>
            <h1 class="vexa-title" style="font-size: 24px;">🧠 Memory Match</h1>
        </div>
        
        <div class="game-stats">
            <div class="stat-box">
                <div class="stat-label">Moves</div>
                <div class="stat-value" id="moves">0</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">Matches</div>
                <div class="stat-value" id="matches">0</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">Time</div>
                <div class="stat-value" id="time">0s</div>
            </div>
        </div>
        
        <div class="memory-grid" id="memory-grid"></div>
        
        <div class="result-text" id="result"></div>
        
        <button class="btn btn-primary" onclick="newGame()">NEW GAME</button>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-database-compat.js"></script>
    <script src="../js/firebase-config.js"></script>
    <script src="../js/utils.js"></script>
    <script>
        let currentUser = null;
        let moves = 0;
        let matches = 0;
        let flippedCards = [];
        let timer = null;
        let seconds = 0;
        let isLocked = false;
        
        const emojis = ['🎮', '🚀', '⭐', '🎯', '💎', '🔥', '🌟', '🎨'];
        
        auth.onAuthStateChanged(async (user) => {
            if (!user) {
                window.location.href = '../login.html';
                return;
            }
            currentUser = user;
            newGame();
        });
        
        function newGame() {
            clearInterval(timer);
            moves = 0;
            matches = 0;
            seconds = 0;
            flippedCards = [];
            isLocked = false;
            
            document.getElementById('moves').textContent = moves;
            document.getElementById('matches').textContent = matches;
            document.getElementById('time').textContent = '0s';
            document.getElementById('result').textContent = '';
            
            const cards = [...emojis, ...emojis];
            cards.sort(() => Math.random() - 0.5);
            
            const grid = document.getElementById('memory-grid');
            grid.innerHTML = '';
            
            cards.forEach((emoji, index) => {
                const card = document.createElement('div');
                card.className = 'memory-card';
                card.dataset.emoji = emoji;
                card.dataset.index = index;
                card.onclick = () => flipCard(card);
                grid.appendChild(card);
            });
            
            timer = setInterval(() => {
                seconds++;
                document.getElementById('time').textContent = `${seconds}s`;
            }, 1000);
        }
        
        function flipCard(card) {
            if (isLocked || card.classList.contains('flipped') || card.classList.contains('matched')) return;
            
            card.classList.add('flipped');
            card.textContent = card.dataset.emoji;
            flippedCards.push(card);
            
            if (flippedCards.length === 2) {
                moves++;
                document.getElementById('moves').textContent = moves;
                
                if (flippedCards[0].dataset.emoji === flippedCards[1].dataset.emoji) {
                    flippedCards[0].classList.add('matched');
                    flippedCards[1].classList.add('matched');
                    matches++;
                    document.getElementById('matches').textContent = matches;
                    flippedCards = [];
                    
                    if (matches === emojis.length) {
                        clearInterval(timer);
                        document.getElementById('result').textContent = `🎉 Completed in ${moves} moves and ${seconds}s!`;
                        document.getElementById('result').style.color = '#10b981';
                        awardRewards();
                    }
                } else {
                    isLocked = true;
                    setTimeout(() => {
                        flippedCards[0].classList.remove('flipped');
                        flippedCards[1].classList.remove('flipped');
                        flippedCards[0].textContent = '';
                        flippedCards[1].textContent = '';
                        flippedCards = [];
                        isLocked = false;
                    }, 1000);
                }
            }
        }
        
        async function awardRewards() {
            const coinsEarned = 50;
            const xpEarned = 15;
            
            const progressRef = database.ref(`usersProgress/${currentUser.uid}`);
            const snapshot = await progressRef.once('value');
            const data = snapshot.val();
            
            await progressRef.update({
                coins: data.coins + coinsEarned,
                totalXP: data.totalXP + xpEarned
            });
            
            const statsRef = database.ref(`gameStats/${currentUser.uid}/memory`);
            const statsSnapshot = await statsRef.once('value');
            const stats = statsSnapshot.val() || { gamesPlayed: 0, highScore: 0 };
            
            await statsRef.update({
                gamesPlayed: stats.gamesPlayed + 1,
                highScore: Math.max(stats.highScore, matches)
            });
            
            ChronoUtils.showToast(`Earned ${coinsEarned} coins and ${xpEarned} XP!`, 'success');
        }
    </script>
</body>
</html>
