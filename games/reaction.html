<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VEXA - Reaction Time</title>
    <link rel="icon" type="image/svg+xml" href="../assets/logo/vexa-icon.svg">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Rajdhani:wght@300;400;500;600;700&family=Exo+2:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="../css/vexa-brand.css">
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/animations.css">
    <style>
        .game-container {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
        }
        
        .game-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            max-width: 400px;
            margin-bottom: 20px;
        }
        
        .back-btn {
            background: var(--vexa-glass);
            border: 1px solid var(--vexa-glass-border);
            color: var(--text-primary);
            padding: 8px 16px;
            border-radius: var(--vexa-radius-md);
            cursor: pointer;
            text-decoration: none;
            font-family: var(--vexa-font-secondary);
            font-weight: 600;
            font-size: 14px;
        }
        
        .reaction-area {
            width: 100%;
            max-width: 400px;
            height: 400px;
            background: var(--vexa-glass);
            border: 2px solid var(--vexa-glass-border);
            border-radius: var(--vexa-radius-xl);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            margin: 20px 0;
            position: relative;
            overflow: hidden;
        }
        
        .reaction-area.waiting {
            background: rgba(239, 68, 68, 0.2);
            border-color: #ef4444;
        }
        
        .reaction-area.ready {
            background: rgba(16, 185, 129, 0.2);
            border-color: #10b981;
            cursor: pointer;
        }
        
        .reaction-area.too-early {
            background: rgba(245, 158, 11, 0.2);
            border-color: #f59e0b;
        }
        
        .reaction-text {
            font-size: 32px;
            font-weight: 700;
            text-align: center;
            font-family: var(--vexa-font-primary);
            color: var(--text-primary);
        }
        
        .game-stats {
            display: flex;
            gap: 16px;
            justify-content: center;
            margin: 20px 0;
            width: 100%;
            max-width: 400px;
        }
        
        .stat-box {
            background: var(--vexa-glass);
            border: 1px solid var(--vexa-glass-border);
            border-radius: var(--vexa-radius-md);
            padding: 12px;
            flex: 1;
            text-align: center;
        }
        
        .stat-label {
            font-size: 11px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            font-family: var(--vexa-font-secondary);
            font-weight: 600;
        }
        
        .stat-value {
            font-size: 20px;
            font-weight: 700;
            color: var(--vexa-secondary);
            font-family: var(--vexa-font-primary);
        }
        
        .result-text {
            font-size: 20px;
            font-weight: bold;
            margin: 16px 0;
            min-height: 30px;
        }
        
        .play-btn {
            padding: 16px 32px;
            background: linear-gradient(135deg, var(--vexa-primary), var(--vexa-secondary));
            border: none;
            border-radius: var(--vexa-radius-md);
            color: white;
            font-family: var(--vexa-font-secondary);
            font-weight: 700;
            font-size: 18px;
            cursor: pointer;
            letter-spacing: 2px;
            transition: all 0.3s ease;
        }
        
        .play-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(108, 60, 225, 0.5);
        }
    </style>
</head>
<body>
    <div class="vexa-bg-pattern"></div>
    
    <div class="game-container">
        <div class="game-header">
            <a href="../games.html" class="back-btn">← Back</a>
            <h1 class="vexa-title" style="font-size: 24px;">⚡ Reaction Time</h1>
        </div>
        
        <div class="game-stats">
            <div class="stat-box">
                <div class="stat-label">Best Time</div>
                <div class="stat-value" id="best-time">0ms</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">Attempts</div>
                <div class="stat-value" id="attempts">0</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">Coins</div>
                <div class="stat-value" id="coins">0</div>
            </div>
        </div>
        
        <div class="reaction-area" id="reaction-area" onclick="handleReaction()">
            <div class="reaction-text" id="reaction-text">CLICK TO START</div>
        </div>
        
        <div class="result-text" id="result"></div>
        
        <button class="play-btn" onclick="startGame()">START GAME</button>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-database-compat.js"></script>
    <script src="../js/firebase-config.js"></script>
    <script src="../js/utils.js"></script>
    <script>
        let currentUser = null;
        let bestTime = null;
        let attempts = 0;
        let coins = 0;
        let gameState = 'idle';
        let startTime = null;
        let timeoutId = null;
        
        auth.onAuthStateChanged(async (user) => {
            if (!user) {
                window.location.href = '../login.html';
                return;
            }
            currentUser = user;
            await loadUserData();
        });
        
        async function loadUserData() {
            const progressSnapshot = await database.ref(`usersProgress/${currentUser.uid}`).once('value');
            const progressData = progressSnapshot.val();
            coins = progressData.coins;
            document.getElementById('coins').textContent = coins;
            
            const statsSnapshot = await database.ref(`gameStats/${currentUser.uid}/reaction`).once('value');
            const stats = statsSnapshot.val();
            if (stats) {
                bestTime = stats.highScore || null;
                attempts = stats.gamesPlayed || 0;
                document.getElementById('best-time').textContent = bestTime ? `${bestTime}ms` : '0ms';
                document.getElementById('attempts').textContent = attempts;
            }
        }
        
        function startGame() {
            const area = document.getElementById('reaction-area');
            const text = document.getElementById('reaction-text');
            
            gameState = 'waiting';
            area.className = 'reaction-area waiting';
            text.textContent = 'WAIT FOR GREEN...';
            document.getElementById('result').textContent = '';
            
            const delay = Math.random() * 3000 + 2000;
            timeoutId = setTimeout(() => {
                gameState = 'ready';
                area.className = 'reaction-area ready';
                text.textContent = 'CLICK NOW!';
                startTime = Date.now();
            }, delay);
        }
        
        function handleReaction() {
            const area = document.getElementById('reaction-area');
            const text = document.getElementById('reaction-text');
            
            if (gameState === 'idle') {
                startGame();
                return;
            }
            
            if (gameState === 'waiting') {
                clearTimeout(timeoutId);
                gameState = 'idle';
                area.className = 'reaction-area too-early';
                text.textContent = 'TOO EARLY! CLICK TO RETRY';
                document.getElementById('result').textContent = '❌ Too early! Try again!';
                document.getElementById('result').style.color = '#ef4444';
                return;
            }
            
            if (gameState === 'ready') {
                const reactionTime = Date.now() - startTime;
                gameState = 'idle';
                
                attempts++;
                document.getElementById('attempts').textContent = attempts;
                
                if (!bestTime || reactionTime < bestTime) {
                    bestTime = reactionTime;
                    document.getElementById('best-time').textContent = `${bestTime}ms`;
                }
                
                let reward = 0;
                if (reactionTime < 200) {
                    reward = 30;
                    document.getElementById('result').textContent = `🔥 AMAZING! ${reactionTime}ms! +${reward} coins`;
                    document.getElementById('result').style.color = '#10b981';
                } else if (reactionTime < 300) {
                    reward = 20;
                    document.getElementById('result').textContent = `👍 Great! ${reactionTime}ms! +${reward} coins`;
                    document.getElementById('result').style.color = '#00D4FF';
                } else if (reactionTime < 500) {
                    reward = 10;
                    document.getElementById('result').textContent = `Good! ${reactionTime}ms! +${reward} coins`;
                    document.getElementById('result').style.color = '#f59e0b';
                } else {
                    document.getElementById('result').textContent = `Slow! ${reactionTime}ms. Try again!`;
                    document.getElementById('result').style.color = '#ef4444';
                }
                
                coins += reward;
                document.getElementById('coins').textContent = coins;
                
                area.className = 'reaction-area';
                text.textContent = 'CLICK TO START';
                
                saveResults(reactionTime, reward);
            }
        }
        
        async function saveResults(reactionTime, reward) {
            await database.ref(`usersProgress/${currentUser.uid}`).update({
                coins: coins
            });
            
            const statsRef = database.ref(`gameStats/${currentUser.uid}/reaction`);
            await statsRef.update({
                gamesPlayed: attempts,
                highScore: bestTime
            });
            
            if (reward > 0) {
                await awardXP(reward / 2);
            }
        }
        
        async function awardXP(xpAmount) {
            const progressRef = database.ref(`usersProgress/${currentUser.uid}`);
            const snapshot = await progressRef.once('value');
            const data = snapshot.val();
            await progressRef.update({
                totalXP: data.totalXP + xpAmount
            });
        }
    </script>
</body>
</html>
