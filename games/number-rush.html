<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VEXA - Number Rush</title>
    <link rel="stylesheet" href="../css/global.css">
</head>
<body>
    <div class="app-header">
        <a href="../games.html" style="text-decoration:none;color:var(--text-primary);font-size:20px;">←</a>
        <span style="font-weight:600;">🔢 Number Rush</span>
        <span></span>
    </div>

    <div style="max-width:400px;margin:0 auto;padding:16px;text-align:center;">
        <div class="stats-grid" style="grid-template-columns:repeat(3,1fr);">
            <div class="stat-card"><div class="stat-value" id="score">0</div><div class="stat-label">Score</div></div>
            <div class="stat-card"><div class="stat-value" id="time">30s</div><div class="stat-label">Time</div></div>
            <div class="stat-card"><div class="stat-value" id="best">0</div><div class="stat-label">Best</div></div>
        </div>

        <div class="card" style="margin:16px 0;padding:24px;">
            <div style="font-size:36px;font-weight:700;" id="question">5 + 3 = ?</div>
        </div>

        <div style="display:grid;grid-template-columns:repeat(2,1fr);gap:10px;" id="answers-grid"></div>

        <button class="btn btn-primary" style="width:100%;margin-top:16px;" onclick="startGame()">START GAME</button>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-database-compat.js"></script>
    <script src="../js/firebase-config.js"></script>
    <script src="../js/utils.js"></script>
    <script>
        let currentUser = null;
        let score = 0, timeLeft = 30, bestScore = 0;
        let correctAnswer = null, gameActive = false, timerInterval = null;

        auth.onAuthStateChanged(async function(user) {
            if (!user) { window.location.replace('../login.html'); return; }
            currentUser = user;
            var snapshot = await database.ref('gameStats/' + user.uid + '/number-rush').once('value');
            var stats = snapshot.val();
            if (stats) { bestScore = stats.highScore || 0; document.getElementById('best').textContent = bestScore; }
        });

        function startGame() {
            score = 0; timeLeft = 30; gameActive = true;
            document.getElementById('score').textContent = score;
            clearInterval(timerInterval);
            timerInterval = setInterval(function() {
                timeLeft--;
                document.getElementById('time').textContent = timeLeft + 's';
                if (timeLeft <= 0) endGame();
            }, 1000);
            generateQuestion();
        }

        function generateQuestion() {
            if (!gameActive) return;
            var num1 = Math.floor(Math.random() * 20) + 1;
            var num2 = Math.floor(Math.random() * 20) + 1;
            var op = ['+', '-', '×'][Math.floor(Math.random() * 3)];
            
            if (op === '+') correctAnswer = num1 + num2;
            else if (op === '-') { var max = Math.max(num1, num2); var min = Math.min(num1, num2); correctAnswer = max - min; num1 = max; num2 = min; }
            else correctAnswer = num1 * num2;
            
            document.getElementById('question').textContent = num1 + ' ' + op + ' ' + num2 + ' = ?';
            
            var answers = [correctAnswer];
            while (answers.length < 4) {
                var wrong = correctAnswer + Math.floor(Math.random() * 10) - 5;
                if (wrong !== correctAnswer && wrong >= 0 && !answers.includes(wrong)) answers.push(wrong);
            }
            answers.sort(function() { return Math.random() - 0.5; });
            
            var grid = document.getElementById('answers-grid');
            grid.innerHTML = answers.map(function(ans) {
                return '<button class="btn btn-secondary" onclick="checkAnswer(' + ans + ')" style="padding:20px;font-size:20px;">' + ans + '</button>';
            }).join('');
        }

        function checkAnswer(ans) {
            if (!gameActive) return;
            if (ans === correctAnswer) { score += 10; document.getElementById('score').textContent = score; generateQuestion(); }
            else { endGame(); }
        }

        function endGame() {
            gameActive = false;
            clearInterval(timerInterval);
            if (score > bestScore) { bestScore = score; document.getElementById('best').textContent = bestScore; }
            var xpEarned = Math.floor(score / 2);
            var coinsEarned = Math.floor(score / 4);
            showGameEnd(score, xpEarned, coinsEarned);
        }

        function showGameEnd(score, xpEarned, coinsEarned) {
            var overlay = document.createElement('div');
            overlay.style.cssText = 'position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.9);z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px;';
            overlay.innerHTML = `
                <div style="background:var(--bg-card);border:2px solid var(--accent-purple);border-radius:20px;padding:30px;text-align:center;max-width:320px;width:100%;">
                    <div style="font-size:48px;">🔢</div>
                    <h2 style="font-size:22px;margin:8px 0;">Score: ${score}</h2>
                    <div style="display:flex;gap:10px;margin:16px 0;">
                        <div style="background:var(--bg-primary);padding:12px;border-radius:10px;flex:1;">
                            <div style="font-size:20px;font-weight:700;color:var(--accent-blue);">+${xpEarned}</div>
                            <div style="font-size:11px;color:var(--text-muted);">⭐ XP</div>
                        </div>
                        <div style="background:var(--bg-primary);padding:12px;border-radius:10px;flex:1;">
                            <div style="font-size:20px;font-weight:700;color:#FFD700;">+${coinsEarned}</div>
                            <div style="font-size:11px;color:var(--text-muted);">🪙 Coins</div>
                        </div>
                    </div>
                    <button class="btn btn-primary" style="width:100%;margin-bottom:8px;" onclick="claimReward(${xpEarned},${coinsEarned},${score})">CLAIM</button>
                    <button class="btn btn-secondary" style="width:100%;" onclick="window.location.replace('../games.html')">GAMES HUB</button>
                </div>
            `;
            document.body.appendChild(overlay);
        }

        async function claimReward(xpEarned, coinsEarned, score) {
            var progressRef = database.ref('progress/' + currentUser.uid);
            var snapshot = await progressRef.once('value');
            var progress = snapshot.val() || { coins: 0, xp: 0 };
            await progressRef.update({ xp: progress.xp + xpEarned, coins: progress.coins + coinsEarned });
            await database.ref('gameStats/' + currentUser.uid + '/number-rush').update({ gamesPlayed: firebase.database.ServerValue.increment(1), highScore: bestScore });
            Utils.showToast('Reward claimed!', 'success');
            setTimeout(function() { window.location.replace('../games.html'); }, 1000);
        }
    </script>
</body>
</html>
