<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VEXA - Pattern Breaker</title>
    <link rel="stylesheet" href="../css/global.css">
</head>
<body>
    <div class="app-header">
        <a href="../games.html" style="text-decoration:none;color:var(--text-primary);font-size:20px;">←</a>
        <span style="font-weight:600;">🧩 Pattern Breaker</span>
        <span></span>
    </div>

    <div style="max-width:400px;margin:0 auto;padding:16px;text-align:center;">
        <div class="stats-grid" style="grid-template-columns:repeat(2,1fr);">
            <div class="stat-card"><div class="stat-value" id="score">0</div><div class="stat-label">Score</div></div>
            <div class="stat-card"><div class="stat-value" id="level">1</div><div class="stat-label">Level</div></div>
        </div>

        <div class="card" style="margin:16px 0;padding:24px;">
            <div style="font-size:36px;letter-spacing:8px;" id="pattern-display">🔷 🔶 🔷</div>
        </div>

        <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px;" id="options-grid"></div>

        <button class="btn btn-primary" style="width:100%;margin-top:16px;" onclick="startGame()">START GAME</button>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-database-compat.js"></script>
    <script src="../js/firebase-config.js"></script>
    <script src="../js/utils.js"></script>
    <script>
        let currentUser = null;
        let score = 0, level = 1, gameActive = false;
        const shapes = ['🔷','🔶','⭐','🔺','🟢','🔵','🟡','🔴'];
        let correctAnswer = null;

        auth.onAuthStateChanged(function(user) {
            if (!user) { window.location.replace('../login.html'); return; }
            currentUser = user;
        });

        function startGame() {
            score = 0; level = 1; gameActive = true;
            document.getElementById('score').textContent = score;
            document.getElementById('level').textContent = level;
            generatePattern();
        }

        function generatePattern() {
            if (!gameActive) return;
            var patternLength = Math.min(2 + level, 6);
            var baseShapes = shapes.slice(0, Math.min(3 + Math.floor(level / 2), shapes.length));
            var pattern = [];
            var repeatCount = Math.ceil(patternLength / baseShapes.length);
            for (var i = 0; i < repeatCount; i++) pattern.push(...baseShapes);
            
            var displayPattern = pattern.slice(0, patternLength);
            correctAnswer = pattern[patternLength];
            document.getElementById('pattern-display').textContent = displayPattern.join(' ');
            
            var options = [correctAnswer];
            while (options.length < 4) {
                var randomShape = shapes[Math.floor(Math.random() * shapes.length)];
                if (!options.includes(randomShape)) options.push(randomShape);
            }
            options.sort(function() { return Math.random() - 0.5; });
            
            document.getElementById('options-grid').innerHTML = options.map(function(shape) {
                return '<button class="btn btn-secondary" style="font-size:28px;padding:16px;" onclick="checkAnswer(\'' + shape + '\')">' + shape + '</button>';
            }).join('');
        }

        function checkAnswer(selected) {
            if (!gameActive) return;
            if (selected === correctAnswer) {
                score += 10 * level;
                level++;
                document.getElementById('score').textContent = score;
                document.getElementById('level').textContent = level;
                generatePattern();
            } else {
                endGame();
            }
        }

        function endGame() {
            gameActive = false;
            var xpEarned = Math.floor(score / 3);
            var coinsEarned = Math.floor(score / 5);
            showGameEnd(score, xpEarned, coinsEarned);
        }

        function showGameEnd(score, xpEarned, coinsEarned) {
            var overlay = document.createElement('div');
            overlay.style.cssText = 'position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.9);z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px;';
            overlay.innerHTML = `
                <div style="background:var(--bg-card);border:2px solid var(--accent-purple);border-radius:20px;padding:30px;text-align:center;max-width:320px;width:100%;">
                    <div style="font-size:48px;">🧩</div>
                    <h2 style="font-size:22px;margin:8px 0;">Score: ${score}</h2>
                    <div style="display:flex;gap:10px;margin:16px 0;">
                        <div style="background:var(--bg-primary);padding:12px;border-radius:10px;flex:1;">
                            <div style="font-size:20px;font-weight:700;color:var(--accent-blue);">+${xpEarned}</div>
                            <div style="font-size:11px;color:var(--text-muted);">⭐ XP</div>
                        </div>
                        <div style="background:var(--bg-primary);padding:12px;border-radius:10px;flex:1;">
                            <div style="font-size:20px;font-weight:700;color:#FFD700;">+${coinsEarned}</div>
                            <div style="font-size:11px;color:var(--text-muted);">🪙 Coins</div>
                        </div>
                    </div>
                    <button class="btn btn-primary" style="width:100%;margin-bottom:8px;" onclick="claimReward(${xpEarned},${coinsEarned},${score})">CLAIM</button>
                    <button class="btn btn-secondary" style="width:100%;" onclick="window.location.replace('../games.html')">GAMES HUB</button>
                </div>
            `;
            document.body.appendChild(overlay);
        }

        async function claimReward(xpEarned, coinsEarned, score) {
            var progressRef = database.ref('progress/' + currentUser.uid);
            var snapshot = await progressRef.once('value');
            var progress = snapshot.val() || { coins: 0, xp: 0 };
            await progressRef.update({ xp: progress.xp + xpEarned, coins: progress.coins + coinsEarned });
            await database.ref('gameStats/' + currentUser.uid + '/pattern-breaker').update({ gamesPlayed: firebase.database.ServerValue.increment(1), highScore: score });
            Utils.showToast('Reward claimed!', 'success');
            setTimeout(function() { window.location.replace('../games.html'); }, 1000);
        }
    </script>
</body>
</html>
