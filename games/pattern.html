<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VEXA - Pattern Match</title>
    <link rel="icon" type="image/svg+xml" href="../assets/logo/vexa-icon.svg">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Rajdhani:wght@300;400;500;600;700&family=Exo+2:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="../css/vexa-brand.css">
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/animations.css">
    <style>
        .game-container {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
        }
        
        .game-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            max-width: 400px;
            margin-bottom: 20px;
        }
        
        .back-btn {
            background: var(--vexa-glass);
            border: 1px solid var(--vexa-glass-border);
            color: var(--text-primary);
            padding: 8px 16px;
            border-radius: var(--vexa-radius-md);
            cursor: pointer;
            text-decoration: none;
            font-family: var(--vexa-font-secondary);
            font-weight: 600;
            font-size: 14px;
        }
        
        .pattern-display {
            width: 100%;
            max-width: 400px;
            background: var(--vexa-glass);
            border: 2px solid var(--vexa-primary);
            border-radius: var(--vexa-radius-lg);
            padding: 40px;
            text-align: center;
            margin: 20px 0;
            min-height: 150px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .pattern-shapes {
            font-size: 48px;
            letter-spacing: 20px;
            font-family: var(--vexa-font-primary);
        }
        
        .options-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            width: 100%;
            max-width: 400px;
            margin: 20px 0;
        }
        
        .option-btn {
            padding: 20px;
            background: var(--vexa-glass);
            border: 2px solid var(--vexa-glass-border);
            border-radius: var(--vexa-radius-md);
            color: var(--text-primary);
            font-size: 32px;
            cursor: pointer;
            transition: all 0.3s ease;
            aspect-ratio: 1;
        }
        
        .option-btn:hover {
            border-color: var(--vexa-primary);
            box-shadow: 0 0 20px rgba(108, 60, 225, 0.4);
            transform: scale(1.05);
        }
        
        .game-stats {
            display: flex;
            gap: 16px;
            justify-content: center;
            margin: 20px 0;
            width: 100%;
            max-width: 400px;
        }
        
        .stat-box {
            background: var(--vexa-glass);
            border: 1px solid var(--vexa-glass-border);
            border-radius: var(--vexa-radius-md);
            padding: 12px;
            flex: 1;
            text-align: center;
        }
        
        .stat-label {
            font-size: 11px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            font-family: var(--vexa-font-secondary);
            font-weight: 600;
        }
        
        .stat-value {
            font-size: 20px;
            font-weight: 700;
            color: var(--vexa-secondary);
            font-family: var(--vexa-font-primary);
        }
        
        .result-text {
            font-size: 20px;
            font-weight: bold;
            margin: 16px 0;
            min-height: 30px;
        }
    </style>
</head>
<body>
    <div class="vexa-bg-pattern"></div>
    
    <div class="game-container">
        <div class="game-header">
            <a href="../games.html" class="back-btn">← Back</a>
            <h1 class="vexa-title" style="font-size: 24px;">🧩 Pattern Match</h1>
        </div>
        
        <div class="game-stats">
            <div class="stat-box">
                <div class="stat-label">Score</div>
                <div class="stat-value" id="score">0</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">Level</div>
                <div class="stat-value" id="level">1</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">Best</div>
                <div class="stat-value" id="best">0</div>
            </div>
        </div>
        
        <div class="pattern-display">
            <div class="pattern-shapes" id="pattern-display">🔷 🔶 🔷</div>
        </div>
        
        <p style="color: var(--text-muted); margin-bottom: 8px;">What comes next?</p>
        
        <div class="options-grid" id="options-grid"></div>
        
        <div class="result-text" id="result"></div>
        
        <button class="btn btn-primary" onclick="startGame()">START GAME</button>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-database-compat.js"></script>
    <script src="../js/firebase-config.js"></script>
    <script src="../js/utils.js"></script>
    <script>
        let currentUser = null;
        let score = 0;
        let level = 1;
        let bestScore = 0;
        let gameActive = false;
        
        const shapes = ['🔷', '🔶', '⭐', '🔺', '🟢', '🔵', '🟡', '🔴'];
        
        auth.onAuthStateChanged(async (user) => {
            if (!user) {
                window.location.href = '../login.html';
                return;
            }
            currentUser = user;
            await loadUserData();
        });
        
        async function loadUserData() {
            const statsSnapshot = await database.ref(`gameStats/${currentUser.uid}/pattern`).once('value');
            const stats = statsSnapshot.val();
            if (stats) {
                bestScore = stats.highScore || 0;
                document.getElementById('best').textContent = bestScore;
            }
        }
        
        function startGame() {
            gameActive = true;
            score = 0;
            level = 1;
            document.getElementById('score').textContent = score;
            document.getElementById('level').textContent = level;
            document.getElementById('result').textContent = '';
            generatePattern();
        }
        
        function generatePattern() {
            const patternLength = Math.min(2 + level, 6);
            const pattern = [];
            
            // Create a repeating pattern
            const baseShapes = shapes.slice(0, Math.min(3 + Math.floor(level / 2), shapes.length));
            const repeatCount = Math.ceil(patternLength / baseShapes.length);
            
            for (let i = 0; i < repeatCount; i++) {
                pattern.push(...baseShapes);
            }
            
            const displayPattern = pattern.slice(0, patternLength);
            const correctAnswer = pattern[patternLength];
            
            document.getElementById('pattern-display').textContent = displayPattern.join(' ');
            
            // Generate options
            const options = [correctAnswer];
            while (options.length < 4) {
                const randomShape = shapes[Math.floor(Math.random() * shapes.length)];
                if (!options.includes(randomShape)) {
                    options.push(randomShape);
                }
            }
            
            options.sort(() => Math.random() - 0.5);
            
            const optionsGrid = document.getElementById('options-grid');
            optionsGrid.innerHTML = '';
            
            options.forEach(shape => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.textContent = shape;
                btn.onclick = () => checkAnswer(shape, correctAnswer);
                optionsGrid.appendChild(btn);
            });
        }
        
        function checkAnswer(selected, correct) {
            if (!gameActive) return;
            
            if (selected === correct) {
                score += 10 * level;
                level++;
                document.getElementById('score').textContent = score;
                document.getElementById('level').textContent = level;
                document.getElementById('result').textContent = '✓ Correct! +' + (10 * level) + ' points';
                document.getElementById('result').style.color = '#10b981';
                
                if (score > bestScore) {
                    bestScore = score;
                    document.getElementById('best').textContent = bestScore;
                }
                
                setTimeout(() => generatePattern(), 500);
            } else {
                document.getElementById('result').textContent = '✗ Wrong! Game Over!';
                document.getElementById('result').style.color = '#ef4444';
                endGame();
            }
        }
        
        async function endGame() {
            gameActive = false;
            
            const earnedCoins = Math.floor(score / 10);
            
            const progressRef = database.ref(`usersProgress/${currentUser.uid}`);
            const progressSnapshot = await progressRef.once('value');
            const progressData = progressSnapshot.val();
            
            await progressRef.update({
                coins: progressData.coins + earnedCoins
            });
            
            const statsRef = database.ref(`gameStats/${currentUser.uid}/pattern`);
            await statsRef.update({
                gamesPlayed: firebase.database.ServerValue.increment(1),
                highScore: bestScore
            });
            
            if (score > 0) {
                await awardXP(Math.floor(score / 5));
            }
            
            ChronoUtils.showToast(`Earned ${earnedCoins} coins!`, 'success');
        }
        
        async function awardXP(xpAmount) {
            const progressRef = database.ref(`usersProgress/${currentUser.uid}`);
            const snapshot = await progressRef.once('value');
            const data = snapshot.val();
            await progressRef.update({
                totalXP: data.totalXP + xpAmount
            });
        }
    </script>
</body>
</html>
