<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VEXA - Coin Flip</title>
    <link rel="stylesheet" href="../css/global.css">
    <style>
        .game-container {
            max-width: 400px;
            margin: 0 auto;
            padding: 16px;
            text-align: center;
        }
        .coin {
            width: 120px;
            height: 120px;
            margin: 32px auto;
            border-radius: 50%;
            background: linear-gradient(135deg, #FFD700, #FFA500);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
            cursor: pointer;
            box-shadow: 0 8px 24px rgba(255, 215, 0, 0.3);
            transition: transform 0.8s;
        }
        .buttons {
            display: flex;
            gap: 12px;
            justify-content: center;
            margin: 16px 0;
        }
        .result {
            font-size: 18px;
            font-weight: 600;
            margin: 16px 0;
            min-height: 28px;
        }
    </style>
</head>
<body>
    <div class="app-header">
        <a href="../games.html" style="text-decoration:none;color:var(--text-primary);font-size:20px;">←</a>
        <span style="font-weight:600;">🪙 Coin Flip</span>
        <span></span>
    </div>

    <div class="game-container">
        <p style="color:var(--text-muted);font-size:12px;">Virtual coins only. No real-money gambling.</p>
        
        <div class="stats-grid" style="grid-template-columns:repeat(2,1fr);">
            <div class="stat-card">
                <div class="stat-value" id="balance">0</div>
                <div class="stat-label">🪙 Balance</div>
            </div>
            <div class="stat-card">
                <div class="stat-value">50</div>
                <div class="stat-label">Entry Cost</div>
            </div>
        </div>

        <div class="coin" id="coin">🪙</div>

        <div class="buttons">
            <button class="btn btn-primary" onclick="play('heads')">HEADS</button>
            <button class="btn btn-secondary" onclick="play('tails')">TAILS</button>
        </div>

        <div class="result" id="result"></div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-database-compat.js"></script>
    <script src="../js/firebase-config.js"></script>
    <script src="../js/utils.js"></script>
    <script>
        let currentUser = null;
        let balance = 0;
        let isFlipping = false;
        const ENTRY_COST = 50;

        auth.onAuthStateChanged(async function(user) {
            if (!user) {
                window.location.replace('../login.html');
                return;
            }
            currentUser = user;
            
            try {
                var snapshot = await database.ref('progress/' + user.uid).once('value');
                var progress = snapshot.val() || { coins: 0 };
                balance = progress.coins || 0;
                document.getElementById('balance').textContent = balance;
            } catch (error) {
                console.error('Load error:', error);
                document.getElementById('balance').textContent = '0';
            }
        });

        async function play(choice) {
            if (isFlipping) return;
            
            if (balance < ENTRY_COST) {
                Utils.showToast('Not enough coins! Need ' + ENTRY_COST + ' coins', 'error');
                return;
            }
            
            isFlipping = true;
            balance -= ENTRY_COST;
            document.getElementById('balance').textContent = balance;
            
            var resultDiv = document.getElementById('result');
            resultDiv.textContent = 'Flipping...';
            resultDiv.style.color = 'var(--text-primary)';
            
            var coin = document.getElementById('coin');
            coin.style.transform = 'rotate(720deg)';
            
            setTimeout(async function() {
                coin.style.transform = 'rotate(0deg)';
                
                // GENUINE RANDOM
                var randomValue = Math.random();
                var result = randomValue < 0.5 ? 'heads' : 'tails';
                var won = (choice === result);
                
                if (won) {
                    balance += 100;
                    resultDiv.textContent = '🎉 ' + result.toUpperCase() + '! You won +100 coins!';
                    resultDiv.style.color = '#10B981';
                } else {
                    resultDiv.textContent = '😢 ' + result.toUpperCase() + '! You lost -50 coins';
                    resultDiv.style.color = '#EF4444';
                }
                
                document.getElementById('balance').textContent = balance;
                
                try {
                    await database.ref('progress/' + currentUser.uid).update({ coins: balance });
                } catch (error) {
                    console.error('Save error:', error);
                }
                
                isFlipping = false;
            }, 800);
        }
    </script>
</body>
</html>
