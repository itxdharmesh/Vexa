<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VEXA - Coin Flip</title>
    <link rel="stylesheet" href="../css/global.css">
    <style>
        .game-wrap { max-width: 400px; margin: 0 auto; padding: 16px; text-align: center; }
        .coin {
            width: 120px; height: 120px; margin: 32px auto; border-radius: 50%;
            background: linear-gradient(135deg, #FFD700, #FFA500);
            display: flex; align-items: center; justify-content: center; font-size: 48px;
            cursor: pointer; box-shadow: 0 8px 24px rgba(255,215,0,0.3); transition: transform 0.8s;
        }
    </style>
</head>
<body>
    <div class="app-header">
        <a href="../games.html" style="text-decoration:none;color:var(--text-primary);font-size:20px;">←</a>
        <span style="font-weight:600;">🪙 Coin Flip</span>
        <span></span>
    </div>

    <div class="game-wrap">
        <p style="color:var(--text-muted);font-size:12px;">Virtual coins only. No real-money gambling.</p>
        
        <div class="stats-grid" style="grid-template-columns:repeat(2,1fr);">
            <div class="stat-card"><div class="stat-value" id="balance">0</div><div class="stat-label">🪙 Balance</div></div>
            <div class="stat-card"><div class="stat-value">50</div><div class="stat-label">Entry Cost</div></div>
        </div>

        <div class="coin" id="coin">🪙</div>

        <div style="display:flex;gap:12px;justify-content:center;">
            <button class="btn btn-primary" onclick="play('heads')">HEADS</button>
            <button class="btn btn-secondary" onclick="play('tails')">TAILS</button>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-database-compat.js"></script>
    <script src="../js/firebase-config.js"></script>
    <script src="../js/utils.js"></script>
    <script>
        let currentUser = null;
        let balance = 0;
        let isFlipping = false;
        const ENTRY_COST = 50;

        auth.onAuthStateChanged(async function(user) {
            if (!user) { window.location.replace('../login.html'); return; }
            currentUser = user;
            var snapshot = await database.ref('progress/' + user.uid).once('value');
            var progress = snapshot.val() || { coins: 0 };
            balance = progress.coins || 0;
            document.getElementById('balance').textContent = balance;
        });

        async function play(choice) {
            if (isFlipping) return;
            if (balance < ENTRY_COST) { Utils.showToast('Need ' + ENTRY_COST + ' coins!', 'error'); return; }
            
            isFlipping = true;
            balance -= ENTRY_COST;
            document.getElementById('balance').textContent = balance;
            
            var coin = document.getElementById('coin');
            coin.style.transform = 'rotate(720deg)';
            
            setTimeout(async function() {
                coin.style.transform = 'rotate(0deg)';
                var result = Math.random() < 0.5 ? 'heads' : 'tails';
                var won = (choice === result);
                var coinsEarned = won ? 100 : 0;
                var xpEarned = won ? 10 : 2;
                
                if (won) balance += 100;
                document.getElementById('balance').textContent = balance;
                
                try { await database.ref('progress/' + currentUser.uid).update({ coins: balance }); } catch(e) {}
                
                showResult(result, won, xpEarned, coinsEarned);
                isFlipping = false;
            }, 800);
        }

        function showResult(result, won, xpEarned, coinsEarned) {
            var overlay = document.createElement('div');
            overlay.style.cssText = 'position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.9);z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px;';
            overlay.innerHTML = `
                <div style="background:var(--bg-card);border:2px solid var(--accent-purple);border-radius:20px;padding:30px;text-align:center;max-width:320px;width:100%;">
                    <div style="font-size:48px;margin-bottom:12px;">${won ? '🎉' : '😢'}</div>
                    <h2 style="font-size:22px;margin-bottom:4px;">${result.toUpperCase()}!</h2>
                    <p style="color:var(--text-muted);font-size:14px;margin-bottom:16px;">${won ? 'You WON!' : 'You LOST!'}</p>
                    <div style="display:flex;gap:10px;justify-content:center;margin-bottom:20px;">
                        <div style="background:var(--bg-primary);padding:12px;border-radius:10px;flex:1;">
                            <div style="font-size:20px;font-weight:700;color:var(--accent-blue);">+${xpEarned}</div>
                            <div style="font-size:11px;color:var(--text-muted);">⭐ XP</div>
                        </div>
                        <div style="background:var(--bg-primary);padding:12px;border-radius:10px;flex:1;">
                            <div style="font-size:20px;font-weight:700;color:#FFD700;">+${coinsEarned}</div>
                            <div style="font-size:11px;color:var(--text-muted);">🪙 Coins</div>
                        </div>
                    </div>
                    <button class="btn btn-primary" style="width:100%;margin-bottom:8px;" onclick="claimReward(${xpEarned},${coinsEarned})">CLAIM REWARD</button>
                    <button class="btn btn-secondary" style="width:100%;" onclick="window.location.replace('../games.html')">GO TO GAMES HUB</button>
                </div>
            `;
            document.body.appendChild(overlay);
        }

        async function claimReward(xpEarned, coinsEarned) {
            try {
                var progressRef = database.ref('progress/' + currentUser.uid);
                var snapshot = await progressRef.once('value');
                var progress = snapshot.val() || { coins: 0, xp: 0 };
                await progressRef.update({ xp: progress.xp + xpEarned, coins: progress.coins + coinsEarned });
                Utils.showToast('Reward claimed!', 'success');
                setTimeout(function() { window.location.replace('../games.html'); }, 1000);
            } catch(e) { console.error('Claim error:', e); }
        }
    </script>
</body>
</html>
