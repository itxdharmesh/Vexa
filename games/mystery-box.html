<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VEXA - Mystery Box</title>
    <link rel="icon" type="image/svg+xml" href="../assets/logo/vexa-icon.svg">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Rajdhani:wght@300;400;500;600;700&family=Exo+2:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="../css/vexa-brand.css">
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/animations.css">
    <style>
        .game-container {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
        }
        
        .game-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            max-width: 400px;
            margin-bottom: 20px;
        }
        
        .back-btn {
            background: var(--vexa-glass);
            border: 1px solid var(--vexa-glass-border);
            color: var(--text-primary);
            padding: 8px 16px;
            border-radius: var(--vexa-radius-md);
            cursor: pointer;
            text-decoration: none;
            font-family: var(--vexa-font-secondary);
            font-weight: 600;
            font-size: 14px;
        }
        
        .boxes-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
            margin: 40px 0;
            width: 100%;
            max-width: 400px;
        }
        
        .mystery-box {
            aspect-ratio: 1;
            background: var(--vexa-glass);
            border: 2px solid var(--vexa-primary);
            border-radius: var(--vexa-radius-lg);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 60px;
            cursor: pointer;
            transition: all 0.3s ease;
            animation: boxGlow 2s ease-in-out infinite;
        }
        
        .mystery-box:hover {
            transform: scale(1.05);
            box-shadow: 0 0 30px rgba(108, 60, 225, 0.5);
        }
        
        @keyframes boxGlow {
            0%, 100% { box-shadow: 0 0 10px rgba(108, 60, 225, 0.3); }
            50% { box-shadow: 0 0 30px rgba(108, 60, 225, 0.6); }
        }
        
        .mystery-box.opened {
            animation: boxOpen 0.5s ease;
        }
        
        @keyframes boxOpen {
            0% { transform: scale(1) rotate(0deg); }
            50% { transform: scale(1.2) rotate(10deg); }
            100% { transform: scale(1) rotate(0deg); }
        }
        
        .result-text {
            font-size: 24px;
            font-weight: bold;
            margin: 16px 0;
            min-height: 36px;
        }
        
        .game-stats {
            display: flex;
            gap: 16px;
            justify-content: center;
            margin: 24px 0;
            width: 100%;
            max-width: 400px;
        }
        
        .stat-box {
            background: var(--vexa-glass);
            border: 1px solid var(--vexa-glass-border);
            border-radius: var(--vexa-radius-md);
            padding: 12px;
            flex: 1;
            text-align: center;
        }
        
        .stat-label {
            font-size: 11px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .stat-value {
            font-size: 20px;
            font-weight: 700;
            color: var(--vexa-secondary);
        }
    </style>
</head>
<body>
    <div class="vexa-bg-pattern"></div>
    
    <div class="game-container">
        <div class="game-header">
            <a href="../games.html" class="back-btn">← Back</a>
            <h1 class="vexa-title" style="font-size: 24px;">📦 Mystery Box</h1>
        </div>
        
        <div class="game-stats">
            <div class="stat-box">
                <div class="stat-label">Coins</div>
                <div class="stat-value" id="coins">0</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">Boxes Opened</div>
                <div class="stat-value" id="boxes-opened">0</div>
            </div>
        </div>
        
        <p style="color: var(--text-muted);">Choose a box to open (Costs 25 coins)</p>
        
        <div class="boxes-container">
            <div class="mystery-box" onclick="openBox(0)">📦</div>
            <div class="mystery-box" onclick="openBox(1)">📦</div>
            <div class="mystery-box" onclick="openBox(2)">📦</div>
        </div>
        
        <div class="result-text" id="result"></div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-database-compat.js"></script>
    <script src="../js/firebase-config.js"></script>
    <script src="../js/utils.js"></script>
    <script>
        let currentUser = null;
        let coins = 0;
        let boxesOpened = 0;
        let isOpening = false;
        
        const rewards = [
            { icon: '🪙', amount: 50, type: 'coins' },
            { icon: '⭐', amount: 20, type: 'xp' },
            { icon: '💎', amount: 100, type: 'coins' },
            { icon: '🎯', amount: 10, type: 'xp' },
            { icon: '👑', amount: 200, type: 'coins' }
        ];
        
        auth.onAuthStateChanged(async (user) => {
            if (!user) {
                window.location.href = '../login.html';
                return;
            }
            currentUser = user;
            await loadUserData();
        });
        
        async function loadUserData() {
            const snapshot = await database.ref(`usersProgress/${currentUser.uid}`).once('value');
            const data = snapshot.val();
            coins = data.coins;
            document.getElementById('coins').textContent = coins;
        }
        
        async function openBox(index) {
            if (isOpening) return;
            if (coins < 25) {
                ChronoUtils.showToast('Need 25 coins to open a box!', 'error');
                return;
            }
            
            isOpening = true;
            coins -= 25;
            boxesOpened++;
            document.getElementById('coins').textContent = coins;
            document.getElementById('boxes-opened').textContent = boxesOpened;
            
            const boxes = document.querySelectorAll('.mystery-box');
            boxes.forEach(box => box.style.pointerEvents = 'none');
            
            const selectedBox = boxes[index];
            selectedBox.classList.add('opened');
            
            setTimeout(async () => {
                const reward = rewards[Math.floor(Math.random() * rewards.length)];
                selectedBox.textContent = reward.icon;
                
                if (reward.type === 'coins') {
                    coins += reward.amount;
                    document.getElementById('result').textContent = `🎉 You won ${reward.amount} coins!`;
                    document.getElementById('result').style.color = '#10b981';
                } else {
                    document.getElementById('result').textContent = `⭐ You won ${reward.amount} XP!`;
                    document.getElementById('result').style.color = '#00D4FF';
                    await awardXP(reward.amount);
                }
                
                document.getElementById('coins').textContent = coins;
                
                await database.ref(`usersProgress/${currentUser.uid}`).update({
                    coins: coins
                });
                
                const statsRef = database.ref(`gameStats/${currentUser.uid}/mystery_box`);
                const statsSnapshot = await statsRef.once('value');
                const stats = statsSnapshot.val() || { gamesPlayed: 0, highScore: 0 };
                
                await statsRef.update({
                    gamesPlayed: stats.gamesPlayed + 1,
                    highScore: Math.max(stats.highScore, boxesOpened)
                });
                
                setTimeout(() => {
                    boxes.forEach(box => {
                        box.textContent = '📦';
                        box.classList.remove('opened');
                        box.style.pointerEvents = 'auto';
                    });
                    isOpening = false;
                }, 2000);
            }, 500);
        }
        
        async function awardXP(xpAmount) {
            const progressRef = database.ref(`usersProgress/${currentUser.uid}`);
            const snapshot = await progressRef.once('value');
            const data = snapshot.val();
            await progressRef.update({
                totalXP: data.totalXP + xpAmount
            });
        }
    </script>
</body>
</html>
