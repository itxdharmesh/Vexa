<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VEXA - Football Flick</title>
    <link rel="stylesheet" href="../css/global.css">
    <style>
        .field {
            width: 100%; max-width: 400px; height: 300px; margin: 16px auto;
            background: linear-gradient(180deg, #1a5c1a, #0d3d0d);
            border: 2px solid #2d8a2d; border-radius: 16px; position: relative; overflow: hidden;
        }
        .goal-left, .goal-right {
            position: absolute; top: 50%; transform: translateY(-50%);
            width: 80px; height: 120px; border: 3px solid white;
            display: flex; align-items: center; justify-content: center; font-size: 30px;
        }
        .goal-left { left: 0; border-left: none; }
        .goal-right { right: 0; border-right: none; }
        .ball {
            width: 30px; height: 30px; background: white; border-radius: 50%;
            position: absolute; cursor: pointer; display: flex; align-items: center; justify-content: center;
            font-size: 16px; box-shadow: 0 0 10px rgba(255,255,255,0.5);
        }
        .keeper {
            width: 30px; height: 50px; background: #FFD700; border-radius: 8px;
            position: absolute; display: flex; align-items: center; justify-content: center; font-size: 24px;
            transition: all 0.3s;
        }
    </style>
</head>
<body>
    <div class="app-header">
        <a href="../games.html" style="text-decoration:none;color:var(--text-primary);font-size:20px;">←</a>
        <span style="font-weight:600;">⚽ Football Flick</span>
        <span></span>
    </div>

    <div style="max-width:400px;margin:0 auto;padding:16px;text-align:center;">
        <div class="stats-grid" style="grid-template-columns:repeat(3,1fr);">
            <div class="stat-card"><div class="stat-value" id="goals">0</div><div class="stat-label">Goals</div></div>
            <div class="stat-card"><div class="stat-value" id="attempts">0</div><div class="stat-label">Shots</div></div>
            <div class="stat-card"><div class="stat-value" id="time">30s</div><div class="stat-label">Time</div></div>
        </div>

        <div class="field" id="field">
            <div class="goal-left">🥅</div>
            <div class="goal-right">🥅</div>
            <div class="keeper" id="keeper">🧤</div>
            <div class="ball" id="ball" onclick="shoot()">⚽</div>
        </div>

        <button class="btn btn-primary" style="width:100%;" onclick="startGame()">START GAME</button>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-database-compat.js"></script>
    <script src="../js/firebase-config.js"></script>
    <script src="../js/utils.js"></script>
    <script>
        let currentUser = null;
        let goals = 0, attempts = 0, timeLeft = 30;
        let gameActive = false, timerInterval = null;

        auth.onAuthStateChanged(function(user) {
            if (!user) { window.location.replace('../login.html'); return; }
            currentUser = user;
        });

        function startGame() {
            goals = 0; attempts = 0; timeLeft = 30; gameActive = true;
            document.getElementById('goals').textContent = goals;
            document.getElementById('attempts').textContent = attempts;
            clearInterval(timerInterval);
            timerInterval = setInterval(function() {
                timeLeft--;
                document.getElementById('time').textContent = timeLeft + 's';
                if (timeLeft <= 0) endGame();
            }, 1000);
            moveKeeper();
            resetBall();
        }

        function moveKeeper() {
            if (!gameActive) return;
            var keeper = document.getElementById('keeper');
            var field = document.getElementById('field');
            keeper.style.left = '50%';
            keeper.style.top = (Math.random() * (field.clientHeight - 50)) + 'px';
            setTimeout(moveKeeper, Math.random() * 1500 + 800);
        }

        function resetBall() {
            if (!gameActive) return;
            var ball = document.getElementById('ball');
            var field = document.getElementById('field');
            ball.style.left = (Math.random() * (field.clientWidth - 30)) + 'px';
            ball.style.top = (Math.random() * (field.clientHeight - 30)) + 'px';
        }

        function shoot() {
            if (!gameActive) return;
            attempts++;
            document.getElementById('attempts').textContent = attempts;
            
            var ball = document.getElementById('ball');
            var ballRect = ball.getBoundingClientRect();
            var keeper = document.getElementById('keeper');
            var keeperRect = keeper.getBoundingClientRect();
            
            var overlap = !(ballRect.right < keeperRect.left || ballRect.left > keeperRect.right || 
                           ballRect.bottom < keeperRect.top || ballRect.top > keeperRect.bottom);
            
            if (!overlap) {
                goals++;
                document.getElementById('goals').textContent = goals;
            }
            
            setTimeout(resetBall, 500);
        }

        function endGame() {
            gameActive = false;
            clearInterval(timerInterval);
            var xpEarned = goals * 5;
            var coinsEarned = goals * 3;
            showGameEnd(goals, xpEarned, coinsEarned);
        }

        function showGameEnd(goals, xpEarned, coinsEarned) {
            var overlay = document.createElement('div');
            overlay.style.cssText = 'position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.9);z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px;';
            overlay.innerHTML = `
                <div style="background:var(--bg-card);border:2px solid var(--accent-purple);border-radius:20px;padding:30px;text-align:center;max-width:320px;width:100%;">
                    <div style="font-size:48px;">⚽</div>
                    <h2 style="font-size:22px;margin:8px 0;">${goals} Goals!</h2>
                    <div style="display:flex;gap:10px;margin:16px 0;">
                        <div style="background:var(--bg-primary);padding:12px;border-radius:10px;flex:1;">
                            <div style="font-size:20px;font-weight:700;color:var(--accent-blue);">+${xpEarned}</div>
                            <div style="font-size:11px;color:var(--text-muted);">⭐ XP</div>
                        </div>
                        <div style="background:var(--bg-primary);padding:12px;border-radius:10px;flex:1;">
                            <div style="font-size:20px;font-weight:700;color:#FFD700;">+${coinsEarned}</div>
                            <div style="font-size:11px;color:var(--text-muted);">🪙 Coins</div>
                        </div>
                    </div>
                    <button class="btn btn-primary" style="width:100%;margin-bottom:8px;" onclick="claimReward(${xpEarned},${coinsEarned},${goals})">CLAIM</button>
                    <button class="btn btn-secondary" style="width:100%;" onclick="window.location.replace('../games.html')">GAMES HUB</button>
                </div>
            `;
            document.body.appendChild(overlay);
        }

        async function claimReward(xpEarned, coinsEarned, goals) {
            var progressRef = database.ref('progress/' + currentUser.uid);
            var snapshot = await progressRef.once('value');
            var progress = snapshot.val() || { coins: 0, xp: 0 };
            await progressRef.update({ xp: progress.xp + xpEarned, coins: progress.coins + coinsEarned });
            await database.ref('gameStats/' + currentUser.uid + '/football-flick').update({ gamesPlayed: firebase.database.ServerValue.increment(1), highScore: goals });
            Utils.showToast('Reward claimed!', 'success');
            setTimeout(function() { window.location.replace('../games.html'); }, 1000);
        }
    </script>
</body>
</html>
