<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VEXA - Dice Roll</title>
    <link rel="stylesheet" href="../css/global.css">
</head>
<body>
    <div class="app-header">
        <a href="../games.html" style="text-decoration:none;color:var(--text-primary);font-size:20px;">←</a>
        <span style="font-weight:600;">🎲 Dice Roll</span>
        <span></span>
    </div>

    <div style="max-width:400px;margin:0 auto;padding:16px;text-align:center;">
        <p style="color:var(--text-muted);font-size:12px;">Virtual coins only. No real-money gambling.</p>
        
        <div class="stats-grid" style="grid-template-columns:repeat(2,1fr);">
            <div class="stat-card"><div class="stat-value" id="balance">0</div><div class="stat-label">🪙 Balance</div></div>
            <div class="stat-card"><div class="stat-value">25</div><div class="stat-label">Entry Cost</div></div>
        </div>

        <div id="dice" style="font-size:100px;margin:32px 0;">🎲</div>

        <button class="btn btn-primary" style="width:100%;" onclick="rollDice()">ROLL DICE</button>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-database-compat.js"></script>
    <script src="../js/firebase-config.js"></script>
    <script src="../js/utils.js"></script>
    <script>
        let currentUser = null;
        let balance = 0;
        let isRolling = false;
        const ENTRY_COST = 25;
        const diceFaces = ['⚀','⚁','⚂','⚃','⚄','⚅'];

        auth.onAuthStateChanged(async function(user) {
            if (!user) { window.location.replace('../login.html'); return; }
            currentUser = user;
            var snapshot = await database.ref('progress/' + user.uid).once('value');
            var progress = snapshot.val() || { coins: 0 };
            balance = progress.coins || 0;
            document.getElementById('balance').textContent = balance;
        });

        async function rollDice() {
            if (isRolling) return;
            if (balance < ENTRY_COST) { Utils.showToast('Need ' + ENTRY_COST + ' coins!', 'error'); return; }
            
            isRolling = true;
            balance -= ENTRY_COST;
            document.getElementById('balance').textContent = balance;
            
            var dice = document.getElementById('dice');
            var rollCount = 0;
            var rollInterval = setInterval(function() {
                dice.textContent = diceFaces[Math.floor(Math.random() * 6)];
                rollCount++;
                if (rollCount > 15) {
                    clearInterval(rollInterval);
                    var roll = Math.floor(Math.random() * 6) + 1;
                    dice.textContent = diceFaces[roll - 1];
                    
                    var coinsEarned = 0, xpEarned = 2;
                    if (roll === 6) { coinsEarned = 75; xpEarned = 10; }
                    else if (roll >= 4) { coinsEarned = 30; xpEarned = 6; }
                    
                    if (coinsEarned > 0) balance += coinsEarned;
                    document.getElementById('balance').textContent = balance;
                    
                    database.ref('progress/' + currentUser.uid).update({ coins: balance }).catch(function(){});
                    
                    showResult(roll, coinsEarned, xpEarned);
                    isRolling = false;
                }
            }, 100);
        }

        function showResult(roll, coinsEarned, xpEarned) {
            var overlay = document.createElement('div');
            overlay.style.cssText = 'position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.9);z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px;';
            overlay.innerHTML = `
                <div style="background:var(--bg-card);border:2px solid var(--accent-purple);border-radius:20px;padding:30px;text-align:center;max-width:320px;width:100%;">
                    <div style="font-size:48px;">${roll >= 4 ? '🎉' : '😢'}</div>
                    <h2 style="font-size:22px;margin:8px 0;">Rolled ${roll}!</h2>
                    <div style="display:flex;gap:10px;margin:16px 0;">
                        <div style="background:var(--bg-primary);padding:12px;border-radius:10px;flex:1;">
                            <div style="font-size:20px;font-weight:700;color:var(--accent-blue);">+${xpEarned}</div>
                            <div style="font-size:11px;color:var(--text-muted);">⭐ XP</div>
                        </div>
                        <div style="background:var(--bg-primary);padding:12px;border-radius:10px;flex:1;">
                            <div style="font-size:20px;font-weight:700;color:#FFD700;">+${coinsEarned}</div>
                            <div style="font-size:11px;color:var(--text-muted);">🪙 Coins</div>
                        </div>
                    </div>
                    <button class="btn btn-primary" style="width:100%;margin-bottom:8px;" onclick="claimReward(${xpEarned},${coinsEarned})">CLAIM</button>
                    <button class="btn btn-secondary" style="width:100%;" onclick="window.location.replace('../games.html')">GAMES HUB</button>
                </div>
            `;
            document.body.appendChild(overlay);
        }

        async function claimReward(xpEarned, coinsEarned) {
            var progressRef = database.ref('progress/' + currentUser.uid);
            var snapshot = await progressRef.once('value');
            var progress = snapshot.val() || { coins: 0, xp: 0 };
            await progressRef.update({ xp: progress.xp + xpEarned, coins: progress.coins + coinsEarned });
            Utils.showToast('Reward claimed!', 'success');
            setTimeout(function() { window.location.replace('../games.html'); }, 1000);
        }
    </script>
</body>
</html>
