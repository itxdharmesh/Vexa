<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VEXA - Dice Roll</title>
    <link rel="icon" type="image/svg+xml" href="../assets/logo/vexa-icon.svg">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Rajdhani:wght@300;400;500;600;700&family=Exo+2:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="../css/vexa-brand.css">
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/animations.css">
    <style>
        .game-container {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
        }
        
        .game-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            max-width: 400px;
            margin-bottom: 20px;
        }
        
        .back-btn {
            background: var(--vexa-glass);
            border: 1px solid var(--vexa-glass-border);
            color: var(--text-primary);
            padding: 8px 16px;
            border-radius: var(--vexa-radius-md);
            cursor: pointer;
            text-decoration: none;
            font-family: var(--vexa-font-secondary);
            font-weight: 600;
            font-size: 14px;
        }
        
        .dice-container {
            width: 200px;
            height: 200px;
            margin: 40px auto;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .dice {
            width: 150px;
            height: 150px;
            background: white;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 80px;
            font-weight: bold;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
            transition: all 0.3s ease;
        }
        
        .dice.rolling {
            animation: diceRoll 0.5s ease;
        }
        
        @keyframes diceRoll {
            0% { transform: rotate(0deg) scale(1); }
            50% { transform: rotate(180deg) scale(1.2); }
            100% { transform: rotate(360deg) scale(1); }
        }
        
        .roll-btn {
            padding: 16px 32px;
            background: linear-gradient(135deg, var(--vexa-primary), var(--vexa-secondary));
            border: none;
            border-radius: var(--vexa-radius-md);
            color: white;
            font-family: var(--vexa-font-secondary);
            font-weight: 700;
            font-size: 18px;
            cursor: pointer;
            letter-spacing: 2px;
            transition: all 0.3s ease;
            margin: 20px 0;
        }
        
        .roll-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(108, 60, 225, 0.5);
        }
        
        .result-text {
            font-size: 24px;
            font-weight: bold;
            margin: 16px 0;
            min-height: 36px;
        }
        
        .game-stats {
            display: flex;
            gap: 16px;
            justify-content: center;
            margin: 24px 0;
            width: 100%;
            max-width: 400px;
        }
        
        .stat-box {
            background: var(--vexa-glass);
            border: 1px solid var(--vexa-glass-border);
            border-radius: var(--vexa-radius-md);
            padding: 12px;
            flex: 1;
            text-align: center;
        }
        
        .stat-label {
            font-size: 11px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .stat-value {
            font-size: 20px;
            font-weight: 700;
            color: var(--vexa-secondary);
        }
    </style>
</head>
<body>
    <div class="vexa-bg-pattern"></div>
    
    <div class="game-container">
        <div class="game-header">
            <a href="../games.html" class="back-btn">← Back</a>
            <h1 class="vexa-title" style="font-size: 24px;">🎲 Dice Roll</h1>
        </div>
        
        <div class="game-stats">
            <div class="stat-box">
                <div class="stat-label">Balance</div>
                <div class="stat-value" id="balance">0</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">Rolls</div>
                <div class="stat-value" id="rolls">0</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">Best Roll</div>
                <div class="stat-value" id="best-roll">0</div>
            </div>
        </div>
        
        <div class="dice-container">
            <div class="dice" id="dice">🎲</div>
        </div>
        
        <button class="roll-btn" onclick="rollDice()">ROLL DICE</button>
        
        <div class="result-text" id="result"></div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-database-compat.js"></script>
    <script src="../js/firebase-config.js"></script>
    <script src="../js/utils.js"></script>
    <script>
        let currentUser = null;
        let userBalance = 0;
        let totalRolls = 0;
        let bestRoll = 0;
        let isRolling = false;
        
        auth.onAuthStateChanged(async (user) => {
            if (!user) {
                window.location.href = '../login.html';
                return;
            }
            currentUser = user;
            await loadUserData();
        });
        
        async function loadUserData() {
            const snapshot = await database.ref(`usersProgress/${currentUser.uid}`).once('value');
            const data = snapshot.val();
            userBalance = data.coins;
            document.getElementById('balance').textContent = `${userBalance} 🪙`;
        }
        
        async function rollDice() {
            if (isRolling) return;
            if (userBalance < 10) {
                ChronoUtils.showToast('Not enough coins! You need 10 coins to roll.', 'error');
                return;
            }
            
            isRolling = true;
            const dice = document.getElementById('dice');
            dice.classList.add('rolling');
            
            setTimeout(async () => {
                dice.classList.remove('rolling');
                const roll = Math.floor(Math.random() * 6) + 1;
                const diceFaces = ['⚀', '⚁', '⚂', '⚃', '⚄', '⚅'];
                dice.textContent = diceFaces[roll - 1];
                
                totalRolls++;
                if (roll > bestRoll) bestRoll = roll;
                
                document.getElementById('rolls').textContent = totalRolls;
                document.getElementById('best-roll').textContent = bestRoll;
                
                // Rewards based on roll
                let reward = 0;
                if (roll === 6) {
                    reward = 50;
                    document.getElementById('result').textContent = '🎉 Perfect! Rolled 6! +50 coins!';
                    document.getElementById('result').style.color = '#10b981';
                } else if (roll >= 4) {
                    reward = 20;
                    document.getElementById('result').textContent = `👍 Good! Rolled ${roll}! +20 coins!`;
                    document.getElementById('result').style.color = '#00D4FF';
                } else {
                    reward = 0;
                    document.getElementById('result').textContent = `Rolled ${roll}. Try again for 4+!`;
                    document.getElementById('result').style.color = '#f59e0b';
                }
                
                userBalance -= 10;
                userBalance += reward;
                document.getElementById('balance').textContent = `${userBalance} 🪙`;
                
                await database.ref(`usersProgress/${currentUser.uid}`).update({
                    coins: userBalance
                });
                
                const statsRef = database.ref(`gameStats/${currentUser.uid}/dice`);
                const statsSnapshot = await statsRef.once('value');
                const stats = statsSnapshot.val() || { gamesPlayed: 0, highScore: 0 };
                
                await statsRef.update({
                    gamesPlayed: stats.gamesPlayed + 1,
                    highScore: Math.max(stats.highScore, bestRoll)
                });
                
                if (reward > 0) {
                    await awardXP(reward / 5);
                }
                
                isRolling = false;
            }, 500);
        }
        
        async function awardXP(xpAmount) {
            const progressRef = database.ref(`usersProgress/${currentUser.uid}`);
            const snapshot = await progressRef.once('value');
            const data = snapshot.val();
            await progressRef.update({
                totalXP: data.totalXP + xpAmount
            });
        }
    </script>
</body>
</html>
