<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VEXA - Sign Up</title>
    <link rel="stylesheet" href="css/global.css">
</head>
<body>
    <div style="display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px;">
        <div class="card" style="width:100%;max-width:380px;padding:32px;">
            <h1 style="text-align:center;color:var(--accent-blue);font-size:28px;margin-bottom:4px;">VEXA</h1>
            <p style="text-align:center;color:var(--text-muted);margin-bottom:24px;font-size:14px;">Join the future of gaming</p>
            
            <div id="error-box" style="display:none;background:rgba(239,68,68,0.1);border:1px solid #EF4444;color:#EF4444;padding:10px;border-radius:8px;margin-bottom:12px;font-size:13px;"></div>
            
            <form id="signup-form">
                <div style="margin-bottom:14px;">
                    <label style="display:block;margin-bottom:6px;color:var(--text-secondary);font-size:13px;">Username</label>
                    <input type="text" id="username" class="input-field" placeholder="Choose username" required>
                    <p style="font-size:11px;color:var(--text-muted);margin-top:4px;">Letters, numbers, dots, underscores only</p>
                </div>
                <div style="margin-bottom:14px;">
                    <label style="display:block;margin-bottom:6px;color:var(--text-secondary);font-size:13px;">Display Name</label>
                    <input type="text" id="displayName" class="input-field" placeholder="Your name" required>
                </div>
                <div style="margin-bottom:14px;">
                    <label style="display:block;margin-bottom:6px;color:var(--text-secondary);font-size:13px;">Email</label>
                    <input type="email" id="email" class="input-field" placeholder="Enter email" required>
                </div>
                <div style="margin-bottom:20px;">
                    <label style="display:block;margin-bottom:6px;color:var(--text-secondary);font-size:13px;">Password</label>
                    <input type="password" id="password" class="input-field" placeholder="Create password" required>
                </div>
                <button type="submit" class="btn btn-primary" style="width:100%;">CREATE ACCOUNT</button>
            </form>
            
            <p style="text-align:center;margin-top:16px;color:var(--text-muted);font-size:13px;">
                Already have an account? <a href="login.html" style="color:var(--accent-blue);text-decoration:none;font-weight:600;">Login</a>
            </p>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-storage-compat.js"></script>
    <script src="js/firebase-config.js"></script>
    <script src="js/utils.js"></script>
    <script>
        document.getElementById('signup-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            var username = document.getElementById('username').value.trim().toLowerCase();
            var displayName = document.getElementById('displayName').value.trim();
            var email = document.getElementById('email').value;
            var password = document.getElementById('password').value;
            var errorBox = document.getElementById('error-box');
            errorBox.style.display = 'none';
            
            var usernameRegex = /^[a-zA-Z0-9._]+$/;
            if (!usernameRegex.test(username)) {
                errorBox.textContent = 'Username can only contain letters, numbers, dots, underscores';
                errorBox.style.display = 'block';
                return;
            }
            
            if (username.length < 3 || username.length > 20) {
                errorBox.textContent = 'Username must be 3-20 characters';
                errorBox.style.display = 'block';
                return;
            }
            
            try {
                var usernameSnapshot = await database.ref('usernames/' + username).once('value');
                if (usernameSnapshot.exists()) {
                    errorBox.textContent = 'Username already taken';
                    errorBox.style.display = 'block';
                    return;
                }
                
                var result = await auth.createUserWithEmailAndPassword(email, password);
                var user = result.user;
                
                await database.ref('users/' + user.uid).set({
                    username: username,
                    displayName: displayName,
                    email: email,
                    bio: '',
                    avatarURL: '',
                    createdAt: Date.now()
                });
                
                await database.ref('usernames/' + username).set(user.uid);
                
                await database.ref('progress/' + user.uid).set({
                    coins: 100,
                    xp: 0,
                    level: 1
                });
                
                await database.ref('streaks/' + user.uid).set({
                    currentStreak: 1,
                    bestStreak: 1,
                    lastActiveAt: Date.now()
                });
                
                window.location.replace('home.html');
                
            } catch (error) {
                var messages = {
                    'auth/email-already-in-use': 'Email already registered',
                    'auth/invalid-email': 'Invalid email',
                    'auth/weak-password': 'Password too weak (min 6 characters)'
                };
                errorBox.textContent = messages[error.code] || error.message;
                errorBox.style.display = 'block';
            }
        });
    </script>
</body>
</html>
