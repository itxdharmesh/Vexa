<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VEXA - Achievements</title>
    <link rel="stylesheet" href="css/global.css">
</head>
<body>
    <div class="app-header">
        <a href="account.html" style="text-decoration:none;color:var(--text-primary);font-size:20px;">←</a>
        <span style="font-weight:600;">🏆 Achievements</span>
        <span></span>
    </div>

    <div class="container">
        <div id="achievements-grid" style="display:grid;grid-template-columns:repeat(2,1fr);gap:10px;"></div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-database-compat.js"></script>
    <script src="js/firebase-config.js"></script>
    <script src="js/utils.js"></script>
    <script>
        const achievementsList = [
            { id: 'first_game', name: 'First Game', icon: '🎮', description: 'Play your first game' },
            { id: 'high_scorer', name: 'High Scorer', icon: '🏆', description: 'Set your first high score' },
            { id: 'brain_starter', name: 'Brain Starter', icon: '🧠', description: 'Play 10 brain games' },
            { id: 'streak_7', name: '7 Day Streak', icon: '🔥', description: 'Maintain 7-day streak' },
            { id: 'coin_collector', name: 'Coin Collector', icon: '🪙', description: 'Earn 1,000 coins' },
            { id: 'speed_demon', name: 'Speed Demon', icon: '⚡', description: 'Get under 200ms reaction' },
            { id: 'football_fan', name: 'Football Fan', icon: '⚽', description: 'Play Football 10 times' },
            { id: 'memory_master', name: 'Memory Master', icon: '🧠', description: 'Complete memory in under 20 moves' }
        ];
        
        auth.onAuthStateChanged(async function(user) {
            if (!user) { window.location.replace('login.html'); return; }
            
            var snapshot = await database.ref('achievements/' + user.uid).once('value');
            var userAchievements = snapshot.val() || {};
            
            var grid = document.getElementById('achievements-grid');
            
            grid.innerHTML = achievementsList.map(function(achievement) {
                var userData = userAchievements[achievement.id];
                var unlocked = userData && userData.unlocked;
                
                return `
                    <div class="stat-card" style="text-align:center;padding:16px;${unlocked ? 'border-color:#10B981;' : 'opacity:0.6;'}">
                        <div style="font-size:32px;margin-bottom:8px;">${unlocked ? achievement.icon : '🔒'}</div>
                        <div style="font-weight:600;font-size:13px;">${achievement.name}</div>
                        <div style="font-size:11px;color:var(--text-muted);margin-top:4px;">${achievement.description}</div>
                    </div>
                `;
            }).join('');
        });
    </script>
</body>
</html>
