<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VEXA - Achievements</title>
    <link rel="stylesheet" href="css/global.css">
    <style>
        .achievements-container {
            max-width: 500px;
            margin: 0 auto;
            padding: 16px;
        }
        .achievement-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            padding: 16px;
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 10px;
            transition: all 0.3s;
        }
        .achievement-card.unlocked {
            border-color: var(--success);
            background: rgba(16, 185, 129, 0.05);
        }
        .achievement-card.locked {
            opacity: 0.7;
        }
        .achievement-icon {
            font-size: 32px;
            width: 50px;
            text-align: center;
            flex-shrink: 0;
        }
        .achievement-info {
            flex: 1;
        }
        .achievement-name {
            font-weight: 600;
            font-size: 14px;
            margin-bottom: 2px;
        }
        .achievement-desc {
            font-size: 12px;
            color: var(--text-muted);
        }
        .progress-bar {
            width: 100%;
            height: 4px;
            background: var(--bg-primary);
            border-radius: 2px;
            margin-top: 6px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--accent-purple), var(--accent-blue));
            border-radius: 2px;
            transition: width 0.3s;
        }
        .progress-text {
            font-size: 10px;
            color: var(--text-muted);
            margin-top: 2px;
        }
        .status-badge {
            font-size: 11px;
            padding: 2px 8px;
            border-radius: 10px;
            font-weight: 600;
            flex-shrink: 0;
        }
        .status-unlocked {
            background: rgba(16, 185, 129, 0.2);
            color: #10B981;
        }
        .status-locked {
            background: rgba(107, 107, 128, 0.2);
            color: var(--text-muted);
        }
    </style>
</head>
<body>
    <div class="app-header">
        <a href="account.html" style="text-decoration:none;color:var(--text-primary);font-size:20px;">←</a>
        <span style="font-weight:600;">🏆 Achievements</span>
        <span></span>
    </div>

    <div class="achievements-container">
        <div id="achievements-list">
            <p style="text-align:center;color:var(--text-muted);">Loading achievements...</p>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-database-compat.js"></script>
    <script src="js/firebase-config.js"></script>
    <script src="js/utils.js"></script>
    <script>
        const ACHIEVEMENTS = [
            { id: 'first_game', name: 'First Game', icon: '🎮', description: 'Play your first game', target: 1, rewardXP: 50 },
            { id: 'high_scorer', name: 'High Scorer', icon: '🏆', description: 'Set your first high score', target: 1, rewardXP: 50 },
            { id: 'brain_starter', name: 'Brain Starter', icon: '🧠', description: 'Play 10 brain games', target: 10, rewardXP: 75 },
            { id: 'streak_3', name: '3 Day Streak', icon: '🔥', description: 'Maintain a 3-day streak', target: 3, rewardXP: 100 },
            { id: 'streak_7', name: '7 Day Streak', icon: '🔥', description: 'Maintain a 7-day streak', target: 7, rewardXP: 150 },
            { id: 'coin_collector', name: 'Coin Collector', icon: '🪙', description: 'Earn 1,000 coins', target: 1000, rewardXP: 100 },
            { id: 'speed_demon', name: 'Speed Demon', icon: '⚡', description: 'Get under 200ms reaction', target: 200, rewardXP: 100 },
            { id: 'memory_master', name: 'Memory Master', icon: '🧠', description: 'Complete memory game in under 20 moves', target: 20, rewardXP: 75 },
            { id: 'game_master', name: 'Game Master', icon: '👑', description: 'Play 50 games total', target: 50, rewardXP: 200 },
            { id: 'coin_master', name: 'Coin Master', icon: '💰', description: 'Earn 10,000 coins', target: 10000, rewardXP: 300 }
        ];

        auth.onAuthStateChanged(async function(user) {
            if (!user) {
                window.location.replace('login.html');
                return;
            }
            
            await loadAchievements(user.uid);
        });

        async function loadAchievements(userId) {
            var list = document.getElementById('achievements-list');
            
            try {
                var [achievementsSnapshot, progressSnapshot, gameStatsSnapshot, streakSnapshot] = await Promise.all([
                    database.ref('achievements/' + userId).once('value'),
                    database.ref('progress/' + userId).once('value'),
                    database.ref('gameStats/' + userId).once('value'),
                    database.ref('streaks/' + userId).once('value')
                ]);
                
                var userAchievements = achievementsSnapshot.val() || {};
                var progress = progressSnapshot.val() || { coins: 0, xp: 0 };
                var gameStats = gameStatsSnapshot.val() || {};
                var streak = streakSnapshot.val() || { currentStreak: 0 };
                
                // Calculate total games played
                var totalGames = 0;
                Object.values(gameStats).forEach(function(game) {
                    totalGames += game.gamesPlayed || 0;
                });
                
                list.innerHTML = '';
                
                ACHIEVEMENTS.forEach(function(achievement) {
                    var progressValue = 0;
                    
                    switch(achievement.id) {
                        case 'first_game':
                            progressValue = totalGames > 0 ? 1 : 0;
                            break;
                        case 'high_scorer':
                            var hasHighScore = false;
                            Object.values(gameStats).forEach(function(game) {
                                if (game.highScore > 0) hasHighScore = true;
                            });
                            progressValue = hasHighScore ? 1 : 0;
                            break;
                        case 'brain_starter':
                            progressValue = (gameStats['memory-match']?.gamesPlayed || 0) + 
                                           (gameStats['number-rush']?.gamesPlayed || 0) +
                                           (gameStats['pattern-breaker']?.gamesPlayed || 0);
                            break;
                        case 'streak_3':
                            progressValue = Math.min(streak.currentStreak, 3);
                            break;
                        case 'streak_7':
                            progressValue = Math.min(streak.currentStreak, 7);
                            break;
                        case 'coin_collector':
                            progressValue = Math.min(progress.coins, 1000);
                            break;
                        case 'speed_demon':
                            var bestReaction = gameStats['reaction-rush']?.highScore || 999;
                            progressValue = bestReaction <= 200 ? 200 : Math.max(0, 200 - (bestReaction - 200));
                            break;
                        case 'memory_master':
                            var memoryMoves = gameStats['memory-match']?.highScore || 99;
                            progressValue = memoryMoves <= 20 ? 20 : Math.max(0, 20 - (memoryMoves - 20));
                            break;
                        case 'game_master':
                            progressValue = Math.min(totalGames, 50);
                            break;
                        case 'coin_master':
                            progressValue = Math.min(progress.coins, 10000);
                            break;
                    }
                    
                    var unlocked = progressValue >= achievement.target;
                    var percent = Math.min(100, Math.floor((progressValue / achievement.target) * 100));
                    
                    var card = document.createElement('div');
                    card.className = 'achievement-card ' + (unlocked ? 'unlocked' : 'locked');
                    card.innerHTML = `
                        <div class="achievement-icon">${unlocked ? achievement.icon : '🔒'}</div>
                        <div class="achievement-info">
                            <div class="achievement-name">${achievement.name}</div>
                            <div class="achievement-desc">${achievement.description}</div>
                            <div class="progress-bar">
                                <div class="progress-fill" style="width:${percent}%;"></div>
                            </div>
                            <div class="progress-text">${progressValue}/${achievement.target} • +${achievement.rewardXP} XP</div>
                        </div>
                        <span class="status-badge ${unlocked ? 'status-unlocked' : 'status-locked'}">
                            ${unlocked ? '✓ UNLOCKED' : 'LOCKED'}
                        </span>
                    `;
                    list.appendChild(card);
                });
                
            } catch (error) {
                console.error('Achievements load error:', error);
                list.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">⚠️</div>
                        <div class="empty-state-title">Couldn't load achievements</div>
                        <button class="btn btn-secondary btn-small" onclick="loadAchievements(auth.currentUser.uid)">RETRY</button>
                    </div>
                `;
            }
        }
    </script>
</body>
</html>
