<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VEXA - Settings</title>
    <link rel="stylesheet" href="css/global.css">
</head>
<body>
    <div class="app-header">
        <a href="account.html" style="text-decoration:none;color:var(--text-primary);font-size:20px;">←</a>
        <span style="font-weight:600;">⚙️ Settings</span>
        <span></span>
    </div>

    <div class="container">
        <!-- Appearance -->
        <div class="card">
            <h3 style="font-size:16px;margin-bottom:12px;">🎨 Appearance</h3>
            
            <div class="setting-item">
                <span>🌙 Dark Theme</span>
                <div class="toggle active" id="toggle-theme" onclick="toggleSetting('theme')">
                    <div class="toggle-knob"></div>
                </div>
            </div>
            
            <div class="setting-item">
                <span>🔊 Sound Effects</span>
                <div class="toggle active" id="toggle-sound" onclick="toggleSetting('sound')">
                    <div class="toggle-knob"></div>
                </div>
            </div>
            
            <div class="setting-item">
                <span>✨ Reduce Animations</span>
                <div class="toggle" id="toggle-animations" onclick="toggleSetting('animations')">
                    <div class="toggle-knob"></div>
                </div>
            </div>
        </div>

        <!-- Privacy -->
        <div class="card">
            <h3 style="font-size:16px;margin-bottom:12px;">🔒 Privacy</h3>
            
            <div class="setting-item">
                <span>👁️ Show Online Status</span>
                <div class="toggle active" id="toggle-online" onclick="toggleSetting('online')">
                    <div class="toggle-knob"></div>
                </div>
            </div>
            
            <div class="setting-item">
                <span>📅 Show Last Seen</span>
                <div class="toggle active" id="toggle-lastseen" onclick="toggleSetting('lastseen')">
                    <div class="toggle-knob"></div>
                </div>
            </div>
            
            <div class="setting-item">
                <span>✓ Read Receipts</span>
                <div class="toggle active" id="toggle-read" onclick="toggleSetting('read')">
                    <div class="toggle-knob"></div>
                </div>
            </div>
        </div>

        <!-- Notifications -->
        <div class="card">
            <h3 style="font-size:16px;margin-bottom:12px;">🔔 Notifications</h3>
            
            <div class="setting-item">
                <span>💬 Messages</span>
                <div class="toggle active" id="toggle-msg" onclick="toggleSetting('msg')">
                    <div class="toggle-knob"></div>
                </div>
            </div>
            
            <div class="setting-item">
                <span>👥 Friend Requests</span>
                <div class="toggle active" id="toggle-friend" onclick="toggleSetting('friend')">
                    <div class="toggle-knob"></div>
                </div>
            </div>
            
            <div class="setting-item">
                <span>🎁 Daily Rewards</span>
                <div class="toggle active" id="toggle-reward" onclick="toggleSetting('reward')">
                    <div class="toggle-knob"></div>
                </div>
            </div>
        </div>

        <!-- Data -->
        <div class="card">
            <h3 style="font-size:16px;margin-bottom:12px;">💾 Data</h3>
            
            <div class="setting-item" onclick="clearCache()" style="cursor:pointer;">
                <span>🗑️ Clear Local Cache</span>
                <span style="color:var(--text-muted);">›</span>
            </div>
        </div>
    </div>

    <style>
        .setting-item {
            display:flex;
            align-items:center;
            justify-content:space-between;
            padding:14px 0;
            border-bottom:1px solid var(--border);
            font-size:14px;
        }
        .setting-item:last-child {
            border-bottom:none;
        }
        .toggle {
            width:44px;
            height:24px;
            background:var(--bg-primary);
            border-radius:12px;
            cursor:pointer;
            position:relative;
            transition:background 0.3s;
        }
        .toggle.active {
            background:linear-gradient(135deg, var(--accent-purple), var(--accent-blue));
        }
        .toggle-knob {
            position:absolute;
            top:2px;
            left:2px;
            width:20px;
            height:20px;
            background:white;
            border-radius:50%;
            transition:left 0.3s;
        }
        .toggle.active .toggle-knob {
            left:22px;
        }
    </style>

    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-storage-compat.js"></script>
    <script src="js/firebase-config.js"></script>
    <script src="js/utils.js"></script>
    <script>
        auth.onAuthStateChanged(function(user) {
            if (!user) {
                window.location.replace('login.html');
                return;
            }
            loadSettings();
        });
        
        function loadSettings() {
            var settings = JSON.parse(localStorage.getItem('vexa_settings') || '{}');
            
            var keys = ['theme', 'sound', 'animations', 'online', 'lastseen', 'read', 'msg', 'friend', 'reward'];
            
            keys.forEach(function(key) {
                var toggle = document.getElementById('toggle-' + key);
                if (toggle) {
                    if (settings[key] === false) {
                        toggle.classList.remove('active');
                    }
                }
            });
        }
        
        function toggleSetting(key) {
            var toggle = document.getElementById('toggle-' + key);
            toggle.classList.toggle('active');
            
            var settings = JSON.parse(localStorage.getItem('vexa_settings') || '{}');
            settings[key] = toggle.classList.contains('active');
            localStorage.setItem('vexa_settings', JSON.stringify(settings));
            
            Utils.showToast('Setting saved!', 'success');
        }
        
        function clearCache() {
            if (confirm('Clear local cache?')) {
                localStorage.removeItem('vexa_settings');
                Utils.showToast('Cache cleared!', 'success');
            }
        }
    </script>
</body>
</html>a
