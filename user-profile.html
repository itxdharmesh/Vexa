<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VEXA - Profile</title>
    <link rel="stylesheet" href="css/global.css">
</head>
<body>
    <div class="app-header">
        <a href="search.html" style="text-decoration:none;color:var(--text-primary);font-size:20px;">←</a>
        <span style="font-weight:600;">Profile</span>
        <span></span>
    </div>

    <div class="container">
        <div class="card" style="text-align:center;padding:24px;">
            <div class="avatar avatar-large" id="up-avatar" style="margin:0 auto 12px;">?</div>
            <h2 id="up-name" style="font-size:20px;">Loading...</h2>
            <p id="up-username" style="color:var(--text-muted);font-size:14px;">@username</p>
            <p id="up-bio" style="color:var(--text-secondary);font-size:13px;margin-top:8px;">No bio</p>
        </div>

        <div class="stats-grid" style="grid-template-columns:repeat(3,1fr);">
            <div class="stat-card">
                <div class="stat-value" id="up-friends">0</div>
                <div class="stat-label">Friends</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="up-level">1</div>
                <div class="stat-label">⭐ Level</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="up-streak">0</div>
                <div class="stat-label">🔥 Streak</div>
            </div>
        </div>

        <div style="display:flex;gap:10px;">
            <button class="btn btn-primary" style="flex:1;" id="friend-btn" onclick="toggleFriend()">ADD FRIEND</button>
            <button class="btn btn-secondary" style="flex:1;" onclick="messageUser()">MESSAGE</button>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-storage-compat.js"></script>
    <script src="js/firebase-config.js"></script>
    <script src="js/utils.js"></script>
    <script>
        let currentUser = null;
        let targetUserId = new URLSearchParams(window.location.search).get('uid');
        let isFriend = false;
        
        if (!targetUserId) {
            window.location.replace('search.html');
        }
        
        auth.onAuthStateChanged(async function(user) {
            if (!user) { window.location.replace('login.html'); return; }
            currentUser = user;
            await loadUserProfile();
            await checkFriendStatus();
        });
        
        async function loadUserProfile() {
            try {
                var userSnapshot = await database.ref('users/' + targetUserId).once('value');
                var userData = userSnapshot.val() || {};
                
                var progressSnapshot = await database.ref('progress/' + targetUserId).once('value');
                var progressData = progressSnapshot.val() || { xp: 0 };
                
                var streakSnapshot = await database.ref('streaks/' + targetUserId).once('value');
                var streakData = streakSnapshot.val() || { currentStreak: 0 };
                
                var friendsSnapshot = await database.ref('friends/' + targetUserId).once('value');
                var friendsCount = friendsSnapshot.val() ? Object.keys(friendsSnapshot.val()).length : 0;
                
                var levelInfo = Utils.calculateLevel(progressData.xp);
                
                var avatarText = (userData.displayName || '?').charAt(0).toUpperCase();
                var avatarHTML = userData.avatarURL ? 
                    '<img src="' + userData.avatarURL + '" style="width:100%;height:100%;object-fit:cover;border-radius:50%;">' : 
                    avatarText;
                
                document.getElementById('up-avatar').innerHTML = avatarHTML;
                document.getElementById('up-name').textContent = userData.displayName || 'User';
                document.getElementById('up-username').textContent = '@' + (userData.username || 'user');
                document.getElementById('up-bio').textContent = userData.bio || 'No bio';
                document.getElementById('up-friends').textContent = friendsCount;
                document.getElementById('up-level').textContent = levelInfo.level;
                document.getElementById('up-streak').textContent = streakData.currentStreak;
                
            } catch (error) {
                console.error('Error loading profile:', error);
            }
        }
        
        async function checkFriendStatus() {
            try {
                var snapshot = await database.ref('friends/' + currentUser.uid + '/' + targetUserId).once('value');
                isFriend = snapshot.exists();
                
                var btn = document.getElementById('friend-btn');
                if (isFriend) {
                    btn.textContent = 'REMOVE FRIEND';
                    btn.className = 'btn btn-danger';
                    btn.style.flex = '1';
                } else {
                    btn.textContent = 'ADD FRIEND';
                    btn.className = 'btn btn-primary';
                    btn.style.flex = '1';
                }
            } catch (error) {
                console.error('Error checking friend:', error);
            }
        }
        
        async function toggleFriend() {
            if (isFriend) {
                await database.ref('friends/' + currentUser.uid + '/' + targetUserId).remove();
                await database.ref('friends/' + targetUserId + '/' + currentUser.uid).remove();
                isFriend = false;
                Utils.showToast('Friend removed', 'info');
            } else {
                await database.ref('friendRequests/' + targetUserId + '/' + currentUser.uid).set({
                    from: currentUser.uid,
                    to: targetUserId,
                    status: 'pending',
                    createdAt: Date.now()
                });
                Utils.showToast('Friend request sent!', 'success');
            }
            checkFriendStatus();
        }
        
        function messageUser() {
            var displayName = document.getElementById('up-name').textContent;
            sessionStorage.setItem('chatUserId', targetUserId);
            sessionStorage.setItem('chatUserName', displayName);
            window.location.href = 'chat-window.html';
        }
    </script>
</body>
</html>
