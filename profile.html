<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VEXA - My Profile</title>
    <link rel="stylesheet" href="css/global.css">
</head>
<body>
    <div class="app-header">
        <a href="account.html" style="text-decoration:none;color:var(--text-primary);font-size:20px;">←</a>
        <span style="font-weight:600;">My Profile</span>
        <a href="edit-profile.html" style="text-decoration:none;color:var(--accent-blue);font-size:14px;">Edit</a>
    </div>

    <div class="container">
        <div class="card" style="text-align:center;padding:24px;">
            <div class="avatar avatar-large" id="profile-avatar" style="margin:0 auto 12px;">?</div>
            <h2 id="profile-name" style="font-size:20px;">Loading...</h2>
            <p id="profile-username" style="color:var(--text-muted);font-size:14px;">@username</p>
            <p id="profile-bio" style="color:var(--text-secondary);font-size:13px;margin-top:8px;">No bio yet</p>
        </div>

        <div class="stats-grid" style="grid-template-columns:repeat(3,1fr);">
            <div class="stat-card">
                <div class="stat-value" id="profile-friends">0</div>
                <div class="stat-label">Friends</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="profile-followers">0</div>
                <div class="stat-label">Followers</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="profile-following">0</div>
                <div class="stat-label">Following</div>
            </div>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-value" id="profile-level">1</div>
                <div class="stat-label">⭐ Level</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="profile-streak">0</div>
                <div class="stat-label">🔥 Streak</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="profile-games">0</div>
                <div class="stat-label">🎮 Games Played</div>
            </div>
        </div>

        <!-- Achievements -->
        <div class="card">
            <h3 style="font-size:16px;margin-bottom:12px;">🏆 Achievements</h3>
            <div id="achievements-list"></div>
        </div>

        <!-- Game Stats -->
        <div class="card">
            <h3 style="font-size:16px;margin-bottom:12px;">🎮 Game Statistics</h3>
            <div id="game-stats"></div>
        </div>
    </div>

    <nav class="bottom-nav">
        <a href="home.html" class="nav-item"><span class="nav-icon">🏠</span><span>Home</span></a>
        <a href="games.html" class="nav-item"><span class="nav-icon">🎮</span><span>Games</span></a>
        <a href="search.html" class="nav-item"><span class="nav-icon">🔍</span><span>Search</span></a>
        <a href="chat.html" class="nav-item"><span class="nav-icon">💬</span><span>Chat</span></a>
        <a href="account.html" class="nav-item active"><span class="nav-icon">👤</span><span>Account</span></a>
    </nav>

    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-storage-compat.js"></script>
    <script src="js/firebase-config.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/profile.js"></script>
</body>
    </html>
