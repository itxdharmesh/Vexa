<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VEXA - Chat</title>
    <link rel="stylesheet" href="css/global.css">
</head>
<body>
    <div class="app-header">
        <a href="home.html" class="app-logo">VEXA</a>
        <span style="font-size:20px;">💬</span>
    </div>

    <div class="container">
        <h2 style="font-size:20px;margin-bottom:12px;">Chat</h2>
        
        <!-- Chat Search -->
        <input type="text" id="chat-search" class="input-field" placeholder="🔍 Search conversations..." style="margin-bottom:16px;">
        
        <!-- Conversation List -->
        <div id="conversation-list"></div>
        
        <!-- Empty State -->
        <div id="empty-chat" class="empty-state" style="display:none;">
            <div class="empty-state-icon">💬</div>
            <div class="empty-state-title">No conversations yet</div>
            <div class="empty-state-text">Search for someone and start chatting!</div>
            <a href="search.html" class="btn btn-primary">FIND PEOPLE</a>
        </div>
    </div>

    <nav class="bottom-nav">
        <a href="home.html" class="nav-item"><span class="nav-icon">🏠</span><span>Home</span></a>
        <a href="games.html" class="nav-item"><span class="nav-icon">🎮</span><span>Games</span></a>
        <a href="search.html" class="nav-item"><span class="nav-icon">🔍</span><span>Search</span></a>
        <a href="chat.html" class="nav-item active"><span class="nav-icon">💬</span><span>Chat</span></a>
        <a href="account.html" class="nav-item"><span class="nav-icon">👤</span><span>Account</span></a>
    </nav>

    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-storage-compat.js"></script>
    <script src="js/firebase-config.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/chat.js"></script>
</body>
</html>
