<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VEXA - Chat</title>
    <link rel="stylesheet" href="css/global.css">
</head>
<body>
    <div class="app-header">
        <a href="home.html" class="app-logo">VEXA</a>
        <span style="font-size:20px;">💬</span>
    </div>

    <div class="container">
        <h2 style="font-size:20px;margin-bottom:12px;">Chat</h2>
        
        <input type="text" id="chat-search" class="input-field" placeholder="🔍 Search conversations..." style="margin-bottom:16px;">
        
        <div id="conversation-list"></div>
        
        <div id="empty-chat" class="empty-state" style="display:none;">
            <div class="empty-state-icon">💬</div>
            <div class="empty-state-title">No conversations yet</div>
            <div class="empty-state-text">Search for someone and start chatting!</div>
            <a href="search.html" class="btn btn-primary">FIND PEOPLE</a>
        </div>
    </div>

    <nav class="bottom-nav">
        <a href="home.html" class="nav-item"><span class="nav-icon">🏠</span><span>Home</span></a>
        <a href="games.html" class="nav-item"><span class="nav-icon">🎮</span><span>Games</span></a>
        <a href="search.html" class="nav-item"><span class="nav-icon">🔍</span><span>Search</span></a>
        <a href="chat.html" class="nav-item active"><span class="nav-icon">💬</span><span>Chat</span></a>
        <a href="account.html" class="nav-item"><span class="nav-icon">👤</span><span>Account</span></a>
    </nav>

    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-database-compat.js"></script>
    <script src="js/firebase-config.js"></script>
    <script src="js/utils.js"></script>
    <script>
        let currentUser = null;
        let conversations = [];

        auth.onAuthStateChanged(function(user) {
            if (!user) {
                window.location.replace('login.html');
                return;
            }
            currentUser = user;
            loadConversations();
        });

        async function loadConversations() {
            var list = document.getElementById('conversation-list');
            var emptyState = document.getElementById('empty-chat');
            
            list.innerHTML = '<p style="text-align:center;color:var(--text-muted);">Loading conversations...</p>';
            
            try {
                var chatsSnapshot = await database.ref('chats').once('value');
                var chats = chatsSnapshot.val() || {};
                
                conversations = [];
                
                for (var chatId in chats) {
                    var chat = chats[chatId];
                    if (chat.participants && chat.participants[currentUser.uid]) {
                        var otherUserId = null;
                        for (var uid in chat.participants) {
                            if (uid !== currentUser.uid) {
                                otherUserId = uid;
                                break;
                            }
                        }
                        
                        if (otherUserId) {
                            var userSnapshot = await database.ref('users/' + otherUserId).once('value');
                            var userData = userSnapshot.val() || {};
                            
                            var lastMessage = null;
                            if (chat.messages) {
                                var messageKeys = Object.keys(chat.messages);
                                if (messageKeys.length > 0) {
                                    var lastKey = messageKeys[messageKeys.length - 1];
                                    lastMessage = chat.messages[lastKey];
                                }
                            }
                            
                            conversations.push({
                                chatId: chatId,
                                userId: otherUserId,
                                userData: userData,
                                lastMessage: lastMessage
                            });
                        }
                    }
                }
                
                if (conversations.length === 0) {
                    list.innerHTML = '';
                    emptyState.style.display = 'block';
                    return;
                }
                
                emptyState.style.display = 'none';
                renderConversations(conversations);
                
            } catch (error) {
                console.error('Chat load error:', error);
                list.innerHTML = '<p style="text-align:center;color:var(--danger);">Couldn\'t load chats</p>';
            }
        }

        function renderConversations(convs) {
            var list = document.getElementById('conversation-list');
            
            list.innerHTML = convs.map(function(conv) {
                var avatarText = (conv.userData.displayName || '?').charAt(0).toUpperCase();
                var lastText = conv.lastMessage ? conv.lastMessage.text : 'No messages yet';
                var lastTime = conv.lastMessage ? Utils.timeAgo(conv.lastMessage.createdAt) : '';
                
                return `
                    <div class="card" style="display:flex;align-items:center;gap:12px;cursor:pointer;padding:14px;margin-bottom:8px;" onclick="openChat('${conv.userId}', '${conv.userData.displayName || 'User'}')">
                        <div class="avatar">${avatarText}</div>
                        <div style="flex:1;min-width:0;">
                            <div style="display:flex;justify-content:space-between;align-items:center;">
                                <span style="font-weight:600;font-size:14px;">${conv.userData.displayName || 'User'}</span>
                                <span style="font-size:11px;color:var(--text-muted);">${lastTime}</span>
                            </div>
                            <div style="font-size:13px;color:var(--text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${lastText}</div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        document.getElementById('chat-search').addEventListener('input', function(e) {
            var query = e.target.value.toLowerCase().trim();
            
            if (query === '') {
                renderConversations(conversations);
                return;
            }
            
            var filtered = conversations.filter(function(conv) {
                var name = (conv.userData.displayName || '').toLowerCase();
                var username = (conv.userData.username || '').toLowerCase();
                return name.includes(query) || username.includes(query);
            });
            
            if (filtered.length === 0) {
                document.getElementById('conversation-list').innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">💬</div>
                        <div class="empty-state-title">No conversation found</div>
                        <div class="empty-state-text">Try a different name</div>
                    </div>
                `;
                return;
            }
            
            renderConversations(filtered);
        });

        function openChat(userId, displayName) {
            sessionStorage.setItem('chatUserId', userId);
            sessionStorage.setItem('chatUserName', displayName);
            window.location.href = 'chat-window.html';
        }
    </script>
</body>
</html>
