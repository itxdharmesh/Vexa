<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VEXA - Future of Social Gaming</title>
    <link rel="icon" type="image/svg+xml" href="assets/logo/vexa-icon.svg">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Rajdhani:wght@300;400;500;600;700&family=Exo+2:wght@300;400;500;600;700&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="css/flash-screen.css">
    <link rel="stylesheet" href="css/vexa-brand.css">
</head>
<body>
    <!-- Flash Screen -->
    <div id="flash-screen">
        <!-- Animated Background -->
        <div class="flash-bg">
            <div class="particle-field"></div>
            <div class="grid-lines"></div>
            <div class="glow-orb glow-orb-1"></div>
            <div class="glow-orb glow-orb-2"></div>
            <div class="glow-orb glow-orb-3"></div>
        </div>
        
        <!-- Center Content -->
        <div class="flash-content">
            <!-- Logo Animation -->
            <div class="vexa-logo-animation">
                <div class="logo-ring"></div>
                <div class="logo-ring logo-ring-2"></div>
                <div class="logo-ring logo-ring-3"></div>
                <div class="logo-core">
                    <svg width="120" height="120" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <defs>
                            <linearGradient id="vGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" style="stop-color:#6C3CE1;stop-opacity:1" />
                                <stop offset="50%" style="stop-color:#00D4FF;stop-opacity:1" />
                                <stop offset="100%" style="stop-color:#FF3366;stop-opacity:1" />
                            </linearGradient>
                            <filter id="glow">
                                <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
                                <feMerge>
                                    <feMergeNode in="coloredBlur"/>
                                    <feMergeNode in="SourceGraphic"/>
                                </feMerge>
                            </filter>
                        </defs>
                        <!-- Hexagonal border -->
                        <polygon points="60,15 99,37.5 99,82.5 60,105 21,82.5 21,37.5" 
                                 stroke="url(#vGradient)" stroke-width="3" fill="none" opacity="0.5"/>
                        <!-- V Letter -->
                        <path d="M30 40 L60 80 L90 40" 
                              stroke="url(#vGradient)" stroke-width="8" 
                              stroke-linecap="round" stroke-linejoin="round"
                              filter="url(#glow)" fill="none"/>
                        <!-- Tech dots -->
                        <circle cx="30" cy="40" r="4" fill="#00D4FF" opacity="0.8"/>
                        <circle cx="60" cy="80" r="4" fill="#6C3CE1" opacity="0.8"/>
                        <circle cx="90" cy="40" r="4" fill="#FF3366" opacity="0.8"/>
                    </svg>
                </div>
            </div>
            
            <!-- Brand Name -->
            <div class="brand-name">
                <h1 class="vexa-title">VEXA</h1>
                <p class="brand-tagline">FUTURE OF SOCIAL GAMING</p>
            </div>
            
            <!-- Loading Bar -->
            <div class="loading-container">
                <div class="loading-bar">
                    <div class="loading-progress" id="loading-progress"></div>
                </div>
                <div class="loading-text" id="loading-text">INITIALIZING...</div>
            </div>
            
            <!-- Version -->
            <div class="version-text">v1.0.0</div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-database-compat.js"></script>
    <script src="js/firebase-config.js"></script>
    <script src="js/flash-screen.js"></script>
</body>
  </html>
