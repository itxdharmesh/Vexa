<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VEXA - Sign Up</title>
    <link rel="icon" type="image/svg+xml" href="assets/logo/vexa-icon.svg">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Rajdhani:wght@300;400;500;600;700&family=Exo+2:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="css/vexa-brand.css">
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/animations.css">
    <link rel="stylesheet" href="css/responsive.css">
    <style>
        .auth-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
        }
        
        .auth-box {
            width: 100%;
            max-width: 400px;
            background: var(--vexa-glass);
            backdrop-filter: blur(20px);
            border: 1px solid var(--vexa-glass-border);
            border-radius: var(--vexa-radius-xl);
            padding: 40px;
            animation: slideUp 0.5s ease;
        }
        
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .auth-logo {
            text-align: center;
            margin-bottom: 32px;
        }
        
        .auth-title {
            font-family: var(--vexa-font-primary);
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 8px;
        }
        
        .auth-subtitle {
            color: var(--text-muted);
            font-family: var(--vexa-font-secondary);
            margin-bottom: 32px;
        }
        
        .username-hint {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 4px;
        }
        
        .password-strength {
            height: 4px;
            background: var(--bg-secondary);
            border-radius: 2px;
            margin-top: 8px;
            overflow: hidden;
        }
        
        .password-strength-bar {
            height: 100%;
            width: 0%;
            transition: all 0.3s ease;
            border-radius: 2px;
        }
    </style>
</head>
<body>
    <div class="vexa-bg-pattern"></div>
    
    <div class="auth-container">
        <div class="auth-box">
            <div class="auth-logo">
                <div class="vexa-logo" style="justify-content: center;">
                    <div class="vexa-logo-icon"></div>
                </div>
                <h1 class="auth-title vexa-title">VEXA</h1>
                <p class="auth-subtitle">Join the future of gaming</p>
            </div>
            
            <form id="signup-form">
                <div class="input-group">
                    <label class="input-label">Username</label>
                    <input type="text" class="input-field" id="username" placeholder="Choose a username" required>
                    <p class="username-hint">Only letters, numbers, dots (.) and underscores (_) allowed</p>
                </div>
                
                <div class="input-group">
                    <label class="input-label">Display Name</label>
                    <input type="text" class="input-field" id="displayName" placeholder="Your display name" required>
                </div>
                
                <div class="input-group">
                    <label class="input-label">Email</label>
                    <input type="email" class="input-field" id="email" placeholder="Enter your email" required>
                </div>
                
                <div class="input-group">
                    <label class="input-label">Password</label>
                    <input type="password" class="input-field" id="password" placeholder="Create a password" required>
                    <div class="password-strength">
                        <div class="password-strength-bar" id="password-strength-bar"></div>
                    </div>
                    <p class="username-hint" id="password-hint">Use at least 6 characters</p>
                </div>
                
                <button type="submit" class="btn btn-primary vexa-btn vexa-btn-primary" style="width: 100%;">
                    CREATE ACCOUNT
                </button>
            </form>
            
            <p style="text-align: center; margin-top: 24px; color: var(--text-muted); font-size: 14px;">
                Already have an account? 
                <a href="login.html" style="color: var(--vexa-secondary); text-decoration: none; font-weight: 600;">Login</a>
            </p>
        </div>
    </div>
    
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-database-compat.js"></script>
    <script src="js/firebase-config.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/auth.js"></script>
    <script>
        const authManager = new AuthManager();
        authManager.init();
        
        // Username validation on input
        document.getElementById('username').addEventListener('input', function(e) {
            const username = e.target.value;
            const usernameRegex = /^[a-zA-Z0-9._]+$/;
            
            if (username && !usernameRegex.test(username)) {
                e.target.style.borderColor = 'var(--danger)';
                e.target.setCustomValidity('Only letters, numbers, dots, and underscores allowed');
            } else {
                e.target.style.borderColor = '';
                e.target.setCustomValidity('');
            }
        });
        
        // Password strength indicator
        document.getElementById('password').addEventListener('input', function(e) {
            const password = e.target.value;
            const strengthBar = document.getElementById('password-strength-bar');
            const passwordHint = document.getElementById('password-hint');
            
            let strength = 0;
            
            if (password.length >= 6) strength++;
            if (password.length >= 10) strength++;
            if (/[A-Z]/.test(password)) strength++;
            if (/[0-9]/.test(password)) strength++;
            if (/[^A-Za-z0-9]/.test(password)) strength++;
            
            const colors = ['#ef4444', '#f59e0b', '#10b981', '#00D4FF', '#6C3CE1'];
            const hints = ['Very weak', 'Weak', 'Fair', 'Good', 'Strong'];
            
            strengthBar.style.width = `${(strength / 5) * 100}%`;
            strengthBar.style.background = colors[strength - 1] || '#ef4444';
            
            if (password.length === 0) {
                passwordHint.textContent = 'Use at least 6 characters';
            } else if (strength <= 2) {
                passwordHint.textContent = `${hints[strength - 1]} - Add more characters`;
            } else {
                passwordHint.textContent = hints[strength - 1];
            }
        });
        
        document.getElementById('signup-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const username = document.getElementById('username').value;
            const displayName = document.getElementById('displayName').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            try {
                const user = await authManager.signUp(username, displayName, email, password);
                ChronoUtils.showToast('Account created! Please verify your email. 📧', 'success');
                
                // Show verification message
                setTimeout(() => {
                    window.location.href = 'login.html';
                }, 2000);
            } catch (error) {
                ChronoUtils.showToast(error.message, 'error');
            }
        });
    </script>
</body>
</html>
