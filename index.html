<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VEXA</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0A0A0F;
            color: white;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .loading-box { text-align: center; }
        .logo { font-size: 28px; font-weight: 900; color: #00D4FF; margin-bottom: 16px; letter-spacing: 2px; }
        .spinner {
            width: 40px; height: 40px;
            border: 3px solid #1A1A2E;
            border-top-color: #00D4FF;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="loading-box">
        <div class="logo">VEXA</div>
        <div class="spinner"></div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-storage-compat.js"></script>
    <script src="js/firebase-config.js"></script>
    <script>
        // Wait for auth state BEFORE showing anything
        auth.onAuthStateChanged(function(user) {
            if (user) {
                // Check if user data exists in database
                database.ref('users/' + user.uid).once('value').then(function(snapshot) {
                    if (snapshot.exists()) {
                        window.location.replace('home.html');
                    } else {
                        // User exists in auth but not in database - create basic profile
                        var userData = {
                            username: 'user_' + user.uid.substring(0, 6),
                            displayName: user.displayName || 'User',
                            email: user.email,
                            bio: '',
                            avatarURL: '',
                            createdAt: Date.now()
                        };
                        return database.ref('users/' + user.uid).set(userData).then(function() {
                            return database.ref('usernames/' + userData.username).set(user.uid);
                        }).then(function() {
                            return database.ref('progress/' + user.uid).set({
                                coins: 100, xp: 0, level: 1
                            });
                        }).then(function() {
                            return database.ref('streaks/' + user.uid).set({
                                currentStreak: 0, bestStreak: 0, lastActiveAt: Date.now()
                            });
                        }).then(function() {
                            window.location.replace('home.html');
                        });
                    }
                }).catch(function() {
                    window.location.replace('home.html');
                });
            } else {
                window.location.replace('login.html');
            }
        });
    </script>
</body>
</html>
