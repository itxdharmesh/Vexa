<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VEXA - Notifications</title>
    <link rel="stylesheet" href="css/global.css">
</head>
<body>
    <div class="app-header">
        <a href="home.html" style="text-decoration:none;color:var(--text-primary);font-size:20px;">←</a>
        <span style="font-weight:600;">🔔 Notifications</span>
        <span></span>
    </div>

    <div class="container">
        <div id="notifications-list"></div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-database-compat.js"></script>
    <script src="js/firebase-config.js"></script>
    <script src="js/utils.js"></script>
    <script>
        auth.onAuthStateChanged(async function(user) {
            if (!user) { window.location.replace('login.html'); return; }
            loadNotifications(user.uid);
        });
        
        async function loadNotifications(userId) {
            var list = document.getElementById('notifications-list');
            
            try {
                var snapshot = await database.ref('notifications/' + userId).once('value');
                var notifications = snapshot.val() || {};
                
                var items = Object.entries(notifications).reverse();
                
                if (items.length === 0) {
                    list.innerHTML = `
                        <div class="empty-state">
                            <div class="empty-state-icon">🔔</div>
                            <div class="empty-state-title">No notifications</div>
                            <div class="empty-state-text">You're all caught up!</div>
                        </div>
                    `;
                    return;
                }
                
                list.innerHTML = items.map(function([id, notification]) {
                    var icon = notification.type === 'friend_request' ? '👥' :
                               notification.type === 'message' ? '💬' :
                               notification.type === 'achievement' ? '🏆' :
                               notification.type === 'reward' ? '🎁' : '🔔';
                    
                    return `
                        <div class="card" style="display:flex;align-items:center;gap:12px;padding:14px;margin-bottom:8px;">
                            <span style="font-size:24px;">${icon}</span>
                            <div style="flex:1;">
                                <div style="font-size:14px;font-weight:500;">${notification.text || 'Notification'}</div>
                                <div style="font-size:11px;color:var(--text-muted);">${Utils.timeAgo(notification.createdAt)}</div>
                            </div>
                        </div>
                    `;
                }).join('');
                
            } catch (error) {
                console.error('Error loading notifications:', error);
                list.innerHTML = '<p style="text-align:center;color:var(--text-muted);">Failed to load</p>';
            }
        }
    </script>
</body>
</html>
