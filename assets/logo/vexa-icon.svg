<svg width="120" height="120" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <linearGradient id="iconGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#6C3CE1;stop-opacity:1" />
            <stop offset="50%" style="stop-color:#00D4FF;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#FF3366;stop-opacity:1" />
        </linearGradient>
        
        <filter id="glow">
            <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
            <feMerge>
                <feMergeNode in="coloredBlur"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
    </defs>
    
    <!-- Hexagonal border -->
    <polygon points="60,15 99,37.5 99,82.5 60,105 21,82.5 21,37.5" 
             stroke="url(#iconGradient)" stroke-width="3" fill="none" opacity="0.5"/>
    
    <!-- V Letter -->
    <path d="M30 40 L60 80 L90 40" 
          stroke="url(#iconGradient)" stroke-width="8" 
          stroke-linecap="round" stroke-linejoin="round"
          filter="url(#glow)" fill="none"/>
    
    <!-- Tech dots -->
    <circle cx="30" cy="40" r="4" fill="#00D4FF" opacity="0.8"/>
    <circle cx="60" cy="80" r="4" fill="#6C3CE1" opacity="0.8"/>
    <circle cx="90" cy="40" r="4" fill="#FF3366" opacity="0.8"/>
</svg>
