<svg width="500" height="500" viewBox="0 0 500 500" fill="none" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <linearGradient id="vexaGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#6C3CE1;stop-opacity:1" />
            <stop offset="33%" style="stop-color:#00D4FF;stop-opacity:1" />
            <stop offset="66%" style="stop-color:#FF3366;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#FFD700;stop-opacity:1" />
        </linearGradient>
        
        <filter id="glow">
            <feGaussianBlur stdDeviation="10" result="coloredBlur"/>
            <feMerge>
                <feMergeNode in="coloredBlur"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
    </defs>
    
    <!-- Outer Hexagon -->
    <polygon points="250,20 449,134.5 449,365.5 250,480 51,365.5 51,134.5" 
             stroke="url(#vexaGradient)" stroke-width="8" fill="none" opacity="0.3"/>
    
    <!-- Inner Hexagon -->
    <polygon points="250,50 429,153 429,347 250,450 71,347 71,153" 
             stroke="url(#vexaGradient)" stroke-width="4" fill="none" opacity="0.5"/>
    
    <!-- Main V Shape -->
    <path d="M120 150 L250 350 L380 150" 
          stroke="url(#vexaGradient)" stroke-width="20" 
          stroke-linecap="round" stroke-linejoin="round"
          filter="url(#glow)" fill="none"/>
    
    <!-- Tech Nodes -->
    <circle cx="120" cy="150" r="15" fill="#00D4FF"/>
    <circle cx="250" cy="350" r="15" fill="#6C3CE1"/>
    <circle cx="380" cy="150" r="15" fill="#FF3366"/>
    
    <!-- Brand Text -->
    <text x="250" y="480" text-anchor="middle" 
          font-family="Orbitron, sans-serif" font-size="60" font-weight="900" 
          fill="url(#vexaGradient)" letter-spacing="10">VEXA</text>
</svg>
